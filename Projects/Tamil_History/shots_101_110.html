function drawWitheredTree(g, x, y, s = 1, seed = 1) {
  const r = DK.rng(seed);
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  DK.contactShadow(g, 0, 4, 48, 9, 0.35);
  DK.seg(g, [[0, 0], [-4, -75], [2, -145]], 15, '#2b201c');
  const branches = [
    [[0, -85], [-46, -135], [-72, -162]],
    [[-2, -110], [42, -152], [68, -178]],
    [[2, -142], [-24, -195], [-38, -218]],
    [[2, -142], [22, -192], [35, -212]],
    [[-46, -135], [-52, -168]],
    [[42, -152], [48, -184]],
  ];
  branches.forEach((pts, idx) => {
    DK.seg(g, pts, Math.max(3, 8 - idx), DK.shade('#2b201c', (r() - 0.5) * 0.1));
  });
  g.restore();
}

function drawCrackedEarthRoad(g, y = 840) {
  const r = DK.rng(1876);
  g.save();
  g.strokeStyle = 'rgba(10, 6, 6, 0.55)';
  g.lineWidth = 2.2;
  for (let i = 0; i < 26; i++) {
    const sx = 120 + r() * 1680;
    const sy = y + 14 + r() * 210;
    const ang = (r() - 0.5) * 0.9;
    const len = 45 + r() * 85;
    const mx = sx + Math.cos(ang) * len * 0.5 + (r() - 0.5) * 18;
    const my = sy + Math.sin(ang) * len * 0.5 + (r() - 0.5) * 10;
    const ex = sx + Math.cos(ang) * len;
    const ey = sy + Math.sin(ang) * len;
    DK.seg(g, [[sx, sy], [mx, my], [ex, ey]], 2.2, 'rgba(12, 8, 8, 0.58)');
    DK.seg(g, [[mx, my], [mx + (r() - 0.5) * 38, my + 12 + r() * 18]], 1.4, 'rgba(12, 8, 8, 0.42)');
  }
  g.restore();
}

function draw3DAnalyticsBar(g, x, baseY, w, h, mainCol, topLabel, bottomLabel, subLabel, pulse = 0) {
  g.save();
  // Pedestal base
  DK.contactShadow(g, x, baseY + 12, w * 0.85, 18, 0.45);
  DK.rr(g, x - w * 0.62, baseY - 12, w * 1.24, 28, 8);
  g.fillStyle = DK.cylinderGrad(g, x - w * 0.62, baseY - 12, x + w * 0.62, baseY + 16, '#1E293B', -1);
  g.fill();
  g.strokeStyle = DK.alpha(mainCol, 0.65);
  g.lineWidth = 2;
  g.stroke();

  if (h > 2) {
    if (pulse > 0) {
      DK.glow(g, x, baseY - h * 0.6, w * 1.6, mainCol, 0.35 + pulse * 0.35);
    }
    // 3D Cylindrical Column
    DK.rr(g, x - w / 2, baseY - h, w, h, 12);
    g.fillStyle = DK.cylinderGrad(g, x - w / 2, baseY - h, x + w / 2, baseY, mainCol, -1);
    g.fill();
    g.strokeStyle = DK.shade(mainCol, 0.32);
    g.lineWidth = 2.5;
    g.stroke();

    // Top 3D Bevel Cap
    DK.ellipse(g, x, baseY - h + 6, w * 0.48, 12, DK.shade(mainCol, 0.25));

    // Internal Horizontal Measurement Ticks
    g.strokeStyle = 'rgba(255,255,255,0.18)';
    g.lineWidth = 1.5;
    for (let ty = baseY - 56; ty > baseY - h + 20; ty -= 56) {
      g.beginPath();
      g.moveTo(x - w * 0.36, ty);
      g.lineTo(x + w * 0.36, ty);
      g.stroke();
    }

    if (topLabel) {
      DK.text(g, topLabel, x, baseY - h - 28, {
        size: 32,
        font: DK.FONTS.ui,
        weight: 900,
        color: '#FFFFFF',
        glow: 14,
        glowColor: DK.alpha(mainCol, 0.8),
      });
    }
  }

  if (bottomLabel) {
    DK.text(g, bottomLabel, x, baseY + 46, {
      size: 24,
      font: DK.FONTS.ui,
      weight: 800,
      color: '#F8FAFC',
    });
  }
  if (subLabel) {
    DK.text(g, subLabel, x, baseY + 76, {
      size: 18,
      font: DK.FONTS.mono,
      weight: 700,
      color: '#94A3B8',
    });
  }
  g.restore();
}

function drawMortalityGrid(g, baseY = 780) {
  g.save();
  const levels = [
    { h: 0, label: '0' },
    { h: 112, label: '20 LAKHS (2M)' },
    { h: 224, label: '40 LAKHS (4M)' },
    { h: 340, label: '60 LAKHS (6M)' },
    { h: 448, label: '80 LAKHS (8M)' },
    { h: 560, label: '1 CRORE+ (10M+)' },
  ];
  levels.forEach((lv) => {
    const ly = baseY - lv.h;
    g.strokeStyle = lv.h === 340 || lv.h === 560 ? 'rgba(255, 184, 77, 0.28)' : 'rgba(148, 163, 184, 0.14)';
    g.lineWidth = lv.h === 0 ? 3 : 1.5;
    g.setLineDash(lv.h === 0 ? [] : [8, 8]);
    g.beginPath();
    g.moveTo(260, ly);
    g.lineTo(1660, ly);
    g.stroke();
    g.setLineDash([]);
    DK.text(g, lv.label, 240, ly, {
      size: 16,
      font: DK.FONTS.mono,
      weight: 700,
      color: lv.h === 560 ? '#FF4D6A' : '#94A3B8',
      align: 'right',
    });
  });
  g.restore();
}

function drawSwadeshiSteamship(g, x, y, s = 1, t = 0) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  const bob = Math.sin(t * 1.8) * 3;
  g.translate(0, bob);

  // Steam smoke puffs from funnel
  for (let i = 0; i < 5; i++) {
    const u = ((t * 0.45 + i * 0.2) % 1);
    const sx = -10 - u * 95;
    const sy = -95 - u * 55;
    DK.circle(g, sx, sy, 14 + u * 24, DK.alpha('#E2E8F0', (1 - u) * 0.42));
  }

  // Funnel
  DK.rr(g, -18, -92, 32, 54, 4);
  g.fillStyle = '#D97706';
  g.fill();
  g.fillStyle = '#1E293B';
  g.fillRect(-18, -92, 32, 14);

  // Cabin Superstructure
  DK.rr(g, -78, -42, 156, 26, 6);
  g.fillStyle = '#F8FAFC';
  g.fill();

  // Masts & Swadeshi Banner
  DK.seg(g, [[-95, -18], [-95, -118]], 4, '#475569');
  DK.seg(g, [[85, -18], [85, -112]], 4, '#475569');
  const wave = Math.sin(t * 5) * 4;
  DK.poly(g, [[85, -112], [132, -106 + wave], [132, -84 + wave], [85, -88]], '#FF7722');

  // Iron Hull (S.S. Gallia - 1906 Swadeshi Steam Navigation Co.)
  DK.poly(g, [[-165, -18], [175, -18], [145, 24], [-145, 24]], '#1E293B', '#475569', 2);
  DK.seg(g, [[-155, -4], [160, -4]], 4, '#EF4444');
  DK.text(g, 'S.S. GALLIA · SWADESHI (1906)', 0, 8, {
    size: 13,
    font: DK.FONTS.mono,
    weight: 700,
    color: '#FCD34D',
  });
  g.restore();
}

function drawCasteChainObstacle(g, x, y, lt, shatterT = 2.95) {
  g.save();
  g.translate(x, y);

  // Left & Right Stone Pillars holding the chain
  [-240, 240].forEach((px) => {
    DK.rr(g, px - 26, -90, 52, 210, 8);
    g.fillStyle = DK.cylinderGrad(g, px - 26, -90, px + 26, 120, '#334155', -1);
    g.fill();
    DK.circle(g, px, -20, 12, '#0F172A');
  });

  if (lt < shatterT) {
    // Intact heavy dark iron chain vibrating under tension
    const shake = lt > shatterT - 0.6 ? Math.sin(lt * 55) * 5 : 0;
    g.translate(0, shake);
    for (let i = -5; i <= 5; i++) {
      const lx = i * 40;
      const ly = -20 + Math.cos((i / 5) * Math.PI * 0.5) * 14;
      g.save();
      g.translate(lx, ly);
      g.rotate(i % 2 === 0 ? 0.18 : -0.18);
      DK.rr(g, -22, -11, 44, 22, 10);
      g.lineWidth = 7;
      g.strokeStyle = '#1E293B';
      g.stroke();
      g.lineWidth = 2.5;
      g.strokeStyle = '#64748B';
      g.stroke();
      g.restore();
    }
    // Shackled Label Plaque
    DK.rr(g, -135, -46, 270, 48, 10);
    g.fillStyle = '#1E1B2E';
    g.fill();
    g.strokeStyle = '#EF4444';
    g.lineWidth = 2.5;
    g.stroke();
    DK.text(g, 'CASTE HIERARCHY', 0, -22, {
      size: 21,
      font: DK.FONTS.ui,
      weight: 900,
      color: '#FCA5A5',
      spacing: 1.5,
    });
  } else {
    // Shattered Iron Links Flying Outward + Golden Reform Glow
    const u = DK.clamp((lt - shatterT) / 1.4, 0, 1);
    const fade = 1 - u * 0.75;
    DK.glow(g, 0, -20, 210 * (1 - u * 0.3), '#FFD54F', 0.9 * fade);

    const r = DK.rng(1925);
    for (let i = 0; i < 12; i++) {
      const ang = -Math.PI + (i / 11) * Math.PI + (r() - 0.5) * 0.4;
      const spd = 140 + r() * 220;
      const fx = Math.cos(ang) * spd * u;
      const fy = -20 + Math.sin(ang) * spd * u + 260 * u * u;
      g.save();
      g.globalAlpha = fade;
      g.translate(fx, fy);
      g.rotate(u * (i % 2 === 0 ? 6 : -6) + i);
      DK.rr(g, -18, -9, 36, 18, 8);
      g.lineWidth = 6;
      g.strokeStyle = '#334155';
      g.stroke();
      g.restore();
    }
  }
  g.restore();
}

// ============================================================================
// STUDIO PLAYER & HEADLESS RENDER HOOK BOILERPLATE
// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;
window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;
let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});
shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});
document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});
window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
