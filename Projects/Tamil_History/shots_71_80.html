// Ornate 3D Temple Treasure Chest overflowing with Gold, Diamonds & Cat's-Eye Gems
function drawTreasureChest(g, x, y, s = 1, t = 0) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  DK.contactShadow(g, 0, 6, 95, 14, 0.42);

  // Chest lower box
  DK.rr(g, -82, -78, 164, 78, 12);
  g.fillStyle = DK.cylinderGrad(g, -82, -78, 82, 0, '#5C341E', -1);
  g.fill();
  g.strokeStyle = '#FFD54F';
  g.lineWidth = 4;
  g.stroke();

  //Glowing heap of gold coins, diamonds & cat's-eye chrysoberyl gems (வைடூரியம்)
  DK.glow(g, 0, -90, 110, '#FFD54F', 0.65);
  const r = DK.rng(71);
  for (let i = 0; i < 18; i++) {
    const gx = (r() - 0.5) * 130;
    const gy = -78 - r() * 24;
    const col = i % 3 === 0 ? '#A8F0FF' : i % 3 === 1 ? '#68E898' : '#FFD54F';
    DK.circle(g, gx, gy, 7 + r() * 5, DK.sphereGrad(g, gx, gy, 10, col));
  }

  // Sparkle glints
  const sp = 0.6 + 0.4 * Math.sin(t * 7);
  DK.circle(g, -28, -94, 4 * sp, '#FFFFFF');
  DK.circle(g, 34, -88, 5 * sp, '#FFFFFF');
  g.restore();
}

// Monumental Stepped Gopuram Tower (Madurai / Srirangam / Chidambaram)
function drawMonumentalGopuram(g, x, y, w, h, baseCol = '#4A2C24', fireGlow = false, t = 0) {
  g.save();
  if (fireGlow) {
    DK.glow(g, x, y - h * 0.45, w * 1.35, '#FF5E1A', 0.55 + 0.12 * Math.sin(t * 6));
  }
  const tiers = 7;
  for (let i = 0; i < tiers; i++) {
    const u0 = i / tiers;
    const u1 = (i + 1) / tiers;
    const tw0 = DK.lerp(w, w * 0.36, u0);
    const tw1 = DK.lerp(w, w * 0.36, u1);
    const ty0 = y - u0 * h;
    const ty1 = y - u1 * h;
    const col = DK.shade(baseCol, (i % 2) * 0.08 - 0.05);
    DK.poly(g, [
      [x - tw0 / 2, ty0],
      [x + tw0 / 2, ty0],
      [x + tw1 / 2, ty1],
      [x - tw1 / 2, ty1],
    ], col, 'rgba(255, 190, 100, 0.22)', 1.5);
  }
  // Golden Kalasam finials at summit
  for (let k = -2; k <= 2; k++) {
    DK.circle(g, x + k * (w * 0.06), y - h - 8, 5.5, '#FFD54F');
  }
  g.restore();
}

// Fracturing Silhouette Map of Tamilakam (Shot 74)
function drawFracturedTamilMap(g, cx, cy, s = 1, crackProg = 0.5) {
  g.save();
  g.translate(cx, cy);
  g.scale(s, s);

  const sep = crackProg * 28;
  const shards = [
    { ox: -sep * 0.8, oy: -sep * 0.9, pts: [[-40, -240], [110, -230], [95, -75], [-65, -85]], col: '#1C2D4F', label: 'THONDAIMANDALAM' },

// Thirumalai Nayakkar Mahal Grand White-Stucco Foliated Arches (Shot 78)
function drawNayakMahalArches(g, yFloor = 840, lit = 0.8) {
  g.save();
  const cols = [240, 600, 960, 1320, 1680];
  for (let i = 0; i < cols.length - 1; i++) {
    const x0 = cols[i];
    const x1 = cols[i + 1];
    const xm = (x0 + x1) * 0.5;
    // Custodial stucco arch spandrel
    DK.poly(g, [
      [x0, 180],
      [x1, 180],
      [x1, 420],
      [xm + 85, 310],
      [xm, 260],
      [xm - 85, 310],
      [x0, 420],
    ], DK.linGrad(g, 0, 180, 0, 420, ['#F8FAFC', '#E2E8F0', '#CBD5E1']), '#D99B26', 2.5);
  }
  cols.forEach((cx) => {
    // Massive cylindrical white-lime stucco pillar
    DK.rr(g, cx - 44, 340, 88, yFloor - 340, 16);
    g.fillStyle = DK.cylinderGrad(g, cx - 44, 340, cx + 44, 340, '#F1F5F9', -1);
    g.fill();
    // Golden base & capital bands
    DK.rr(g, cx - 52, 330, 104, 24, 6);
    g.fillStyle = '#F5B942';
    g.fill();
    DK.rr(g, cx - 54, yFloor - 28, 108, 28, 6);
    g.fillStyle = '#D99B26';
    g.fill();
    if (lit > 0.3) {
      DK.glow(g, cx, 320, 75, '#FFE094', 0.35 * lit);
    }
  });
  g.restore();
}

// 72 Hexagonal Palayams Strategic Grid Map (Shots 79 & 80)
function drawPalayamHexGrid(g, cx, cy, activeCount = 72, t = 0) {
  g.save();
  g.translate(cx, cy);
  const hexR = 26;
  const dx = hexR * 1.78;
  const dy = hexR * 1.54;
  let idx = 0;

  for (let row = -4; row <= 4; row++) {
    const colsInRow = 8 - Math.abs(row);
    for (let col = 0; col < colsInRow; col++) {
      if (idx >= 72) break;
      const hx = (col - (colsInRow - 1) * 0.5) * dx;
      const hy = row * dy;
      const isLit = idx < activeCount;

      const pts = [];
      for (let k = 0; k < 6; k++) {
        const ang = (k / 6) * Math.PI * 2 + Math.PI / 6;
        pts.push([hx + Math.cos(ang) * (hexR - 2), hy + Math.sin(ang) * (hexR - 2)]);
      }

      const fillCol = isLit
        ? idx % 3 === 0
          ? 'rgba(255, 184, 77, 0.36)'
          : idx % 3 === 1
          ? 'rgba(56, 200, 120, 0.28)'
          : 'rgba(92, 225, 255, 0.28)'
        : 'rgba(20, 36, 72, 0.45)';
      const strokeCol = isLit ? '#FFB84D' : 'rgba(130, 175, 245, 0.25)';

      DK.poly(g, pts, fillCol, strokeCol, isLit ? 2.2 : 1.2);
      if (isLit && idx % 6 === 0) {
        DK.circle(g, hx, hy, 4.5, '#FFD54F');
      }
      idx++;
    }
  }
  g.restore();
}

    k.bed('room', bt + 0.0, bt + 4.8, { gain: 0.6 });
    k.play('counterTick', bt + 0.2, { n: 18, rate: 0.11 });
    k.play('marchSteps', bt + 0.3, { n: 5, rate: 0.42 });
    k.play('swordClash', bt + 2.40, { gain: 0.85 });
  }

  // Schedule automatic transition SFX
  if (window.DK && DK.scheduleTransitions) {
    DK.scheduleTransitions(k, SHOTS, B0, THEME);
  }
}

// ============================================================================
// STUDIO PLAYER & HEADLESS RENDER HOOK BOILERPLATE (SFX + AMBIENT ONLY)
// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;
window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});
shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});

window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
</body></html>
