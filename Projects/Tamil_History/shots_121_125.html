// 1. Shot 121: Continuous 4,200-Year Composite Panorama Skyline & Overlook
function drawCompositePanoramaSkyline(g, gt) {
  const baseY = 760;

  // Distant Western Ghats & Krishnagiri Megalithic Hills across horizon
  FX.hills(g, { seed: 121, y: 745, amp: 120, color: '#5A3A34', freq: 0.0022 });

  // ZONE 1 (LEFT: x 40..480) — 2170 BCE Mayiladumparai Megalithic Hills & Iron Bloomery + 580 BCE Keeladi Brick Walls
  DK.poly(g, [[60, baseY], [220, 565], [370, baseY]], DK.linGrad(g, 220, 565, 220, baseY, ['#6E473B', '#3D251E']));
  // Glowing Bloomery Furnace on hillside
  DK.rr(g, 195, 650, 52, 110, 12);
  g.fillStyle = '#7A422E';
  g.fill();
  DK.glow(g, 221, 665, 55, '#FF6B1A', 0.75 + 0.2 * Math.sin(gt * 6));
  DK.circle(g, 221, 665, 14, '#FFD54F');
  // Keeladi Baked Red-Brick Terraced Walls & Ring Well
  DK.rr(g, 285, 670, 175, 90, 6);
  g.fillStyle = '#A84832';
  g.fill();
  for (let row = 0; row < 4; row++) {
    DK.seg(g, [[285, 690 + row * 18], [460, 690 + row * 18]], 2, 'rgba(60, 20, 14, 0.5)');
  }
  for (let ringIdx = 0; ringIdx < 4; ringIdx++) {
    DK.rr(g, 472, 692 + ringIdx * 16, 44, 15, 7);
    g.fillStyle = '#C86446';
    g.fill();
  }

  // ZONE 2 (CENTER-LEFT: x 520..760) — 7th Century CE Mamallapuram Shore Temple
  const stX = 650;
  for (let tier = 0; tier < 5; tier++) {
    const tw = 140 - tier * 22;
    const th = 28;
    const ty = baseY - (tier + 1) * th;
    DK.rr(g, stX - tw / 2, ty, tw, th, 4);
    g.fillStyle = DK.shade('#8C5E44', tier * 0.05);
    g.fill();
  }
  DK.circle(g, stX, baseY - 150, 9, '#FFD54F');

  // ZONE 3 (CENTER: x 810..1110) — 1010 CE Thanjavur Brihadeeswarar 216-ft Vimana & 80-Ton Capstone
  const btX = 960;
  // Base Mandapam
  DK.rr(g, btX - 165, baseY - 85, 330, 85, 6);
  g.fillStyle = '#7C5138';
  g.fill();
  // 13-Tiered Pyramidal Vimana
  for (let tier = 0; tier < 11; tier++) {
    const u = tier / 10;
    const tw = DK.lerp(220, 68, u);
    const th = 22;
    const ty = baseY - 85 - (tier + 1) * th;
    DK.rr(g, btX - tw / 2, ty, tw, th + 2, 3);
    g.fillStyle = DK.cylinderGrad(g, btX - tw / 2, ty, btX + tw / 2, ty, DK.shade('#A66E4A', (tier % 2) * 0.06), -1);
    g.fill();
  }
  // 80-Ton Cupola (Sikharam) & Gold Kalasam Finial
  const capY = baseY - 85 - 11 * 22;
  DK.ellipse(g, btX, capY - 12, 46, 22, DK.sphereGrad(g, btX, capY - 12, 46, '#C98A58'));
  DK.seg(g, [[btX, capY - 34], [btX, capY - 62]], 6, '#FFD54F');
  DK.circle(g, btX, capY - 46, 9, '#FFD54F');
  DK.glow(g, btX, capY - 48, 48, '#FFE082', 0.85);

  // ZONE 4 (RIGHT: x 1180..1860) — Modern Chennai Skyscrapers, TIDEL IT Towers & Elevated Metro Viaduct
  const bldgs = [
    { x: 1210, w: 88, h: 210, col: '#2D4263' },
    { x: 1315, w: 105, h: 295, col: '#1E3557' },
    { x: 1438, w: 94, h: 250, col: '#28466E' },
    { x: 1550, w: 118, h: 335, col: '#1B3152' },
    { x: 1685, w: 92, h: 225, col: '#2B4870' },
  ];
  bldgs.forEach((b, idx) => {
    DK.rr(g, b.x, baseY - b.h, b.w, b.h, 6);
    g.fillStyle = DK.cylinderGrad(g, b.x, baseY - b.h, b.x + b.w, baseY, b.col, -1);
    g.fill();
    // Illuminated golden/cyan glass curtain wall grid
    g.fillStyle = idx % 2 === 0 ? 'rgba(255, 218, 128, 0.55)' : 'rgba(104, 224, 255, 0.45)';
    for (let wy = baseY - b.h + 22; wy < baseY - 24; wy += 22) {
      for (let wx = b.x + 14; wx < b.x + b.w - 16; wx += 18) {
        g.fillRect(wx, wy, 9, 12);
      }
    }
  });

  // Elevated Chennai Metro Rail Viaduct & Gliding Metro Train
  DK.fillStyle = '#3B4861';
  g.fillRect(1160, baseY - 58, 720, 14);
  for (let px = 1220; px <= 1820; px += 140) {
    g.fillRect(px - 10, baseY - 44, 20, 44);
  }
  const trainX = 1260 + ((gt * 110) % 420);
  DK.rr(g, trainX, baseY - 78, 155, 20, 8);
  g.fillStyle = '#E2EEFF';
  g.fill();
  g.fillStyle = '#00F2FE';
  g.fillRect(trainX + 10, baseY - 73, 135, 6);
}

function drawPanoramaTimelineTerrace(g, gt) {
  // Golden Heritage Promenade Balustrade & Era Milestone Pillars
  FX.ground(g, 840, '#3D2824', '#FFD494', 0.28, true);

  // Low carved stone & glass balustrade along y = 780..840
  DK.rr(g, -100, 772, 2120, 16, 6);
  g.fillStyle = DK.linGrad(g, 0, 772, 1920, 772, ['#8C583A', '#C98A58', '#64748B']);
  g.fill();

  const milestones = [
    { x: 260, yr: '2170 BCE', sub: 'IRON AGE' },
    { x: 610, yr: '600 BCE', sub: 'KEELADI & SANGAM' },
    { x: 960, yr: '1010 CE', sub: 'IMPERIAL CHOLAS' },
    { x: 1480, yr: 'PRESENT', sub: 'MODERN TAMIL NADU' },
  ];
  milestones.forEach((ms) => {
    DK.glow(g, ms.x, 755, 38, '#FFB84D', 0.55 + 0.15 * Math.sin(gt * 3 + ms.x));
    DK.circle(g, ms.x, 780, 9, '#FFD54F');

}

// 2. Shot 122: Kanyakumari Three-Ocean Confluence & 133-Foot Thiruvalluvar Statue
function drawKanyakumariThiruvalluvarMonument(g, gt) {
  const horizonY = 720;

  // Shimmering Three-Ocean Confluence Water Plane (Indian Ocean, Bay of Bengal, Arabian Sea)
  g.fillStyle = DK.linGrad(g, 0, horizonY, 0, 1080, ['#0A1636', '#061029', '#040817']);
  g.fillRect(-200, horizonY, 2320, 400);

  // Animated Starlight & Spotlight Water Reflections
  FX.pool(g, 960, 795, 580, 95, '#5CE1FF', 0.18);
  FX.pool(g, 960, 775, 280, 65, '#FFD584', 0.34);

  g.save();
  g.strokeStyle = 'rgba(168, 240, 255, 0.25)';
  g.lineWidth = 2;
  for (let wy = horizonY + 12; wy < 860; wy += 12) {
    const span = 260 + (wy - horizonY) * 2.4;
    const waveOff = Math.sin(gt * 2.2 + wy * 0.15) * 18;
    g.beginPath();
    g.moveTo(960 - span * 0.5 + waveOff, wy);
    g.lineTo(960 + span * 0.5 + waveOff, wy);
    g.stroke();
  }
  g.restore();

  // Distant Left Rock Island Silhouette: Vivekananda Rock Memorial
  const vrX = 330, vrY = 725;
  DK.poly(g, [[vrX - 150, vrY + 15], [vrX - 95, vrY - 42], [vrX + 95, vrY - 45], [vrX + 155, vrY + 15]], '#141E38');
  DK.rr(g, vrX - 52, vrY - 82, 104, 40, 4);
  g.fillStyle = '#2A395C';
  g.fill();
  g.beginPath();
  g.arc(vrX, vrY - 82, 32, Math.PI, 0);
  g.fillStyle = '#3B4F7A';
  g.fill();
  DK.glow(g, vrX, vrY - 75, 55, '#FFB860', 0.35);

  // HERO MIDGROUND MONUMENT: 133-Foot Thiruvalluvar Statue at (960, 740)
  const sx = 960, sy = 748;
  g.save();
  g.translate(sx, sy);

  // Twin Upward Golden-Amber Spotlights Illuminating the Statue
  FX.lightCone(g, -135, -20, { angle: -Math.PI * 0.38, spread: 0.48, len: 520, color: '#FFE09E', a: 0.26 });
  FX.lightCone(g, 135, -20, { angle: -Math.PI * 0.62, spread: 0.48, len: 520, color: '#FFE09E', a: 0.26 });
  DK.glow(g, 0, -240, 260, '#FFD584', 0.25);

  // Granite Sea Cliff Island Base
  DK.poly(
    g,
    [
      [-240, 22],
      [-185, -48],
      [-75, -66],
      [85, -66],
      [190, -45],
      [245, 22],
    ],
    DK.linGrad(g, 0, -66, 0, 22, ['#2C3854', '#161E33'])
  );

  // 38-Foot Adhishtanam Pedestal (Representing 38 Chapters of Virtue / Aram)
  DK.rr(g, -96, -158, 192, 94, 6);
  g.fillStyle = DK.cylinderGrad(g, -96, -158, 96, -64, '#8A7968', -1);
  g.fill();
  // Carved Pillar Reliefs on Pedestal
  for (let px = -76; px <= 76; px += 30) {
    DK.rr(g, px - 5, -148, 10, 76, 2);
    g.fillStyle = '#635547';
    g.fill();
  }
  DK.rr(g, -108, -168, 216, 14, 4);
  g.fillStyle = '#A89480';
  g.fill();
  DK.rr(g, -112, -68, 224, 12, 4);
  g.fill();

  // 95-Foot Stone Sculpture of Poet-Saint Thiruvalluvar (Total 133 Feet = 133 Chapters)
  const stoneCol = '#C8B8A2';
  const stoneHi = '#E8D8C0';
  const stoneSh = '#7D6E5D';

  // Lotus Plinth (Padma Peetam)
  DK.ellipse(g, 0, -172, 64, 12, stoneCol);

  // Flowing Stone Dhoti & Lower Robes
  DK.poly(
    g,
    [
      [-46, -172],
      [46, -172],
      [54, -295],
      [-54, -295],
    ],
    DK.cylinderGrad(g, -54, -295, 54, -172, stoneCol, -1)
  );
  // Sculpted Upper Torso & Diagonal Uttariya Shawl Drape
  DK.rr(g, -56, -385, 112, 98, 24);
  g.fillStyle = DK.cylinderGrad(g, -56, -385, 56, -287, stoneCol, -1);
  g.fill();
  DK.poly(g, [[-56, -380], [-14, -380], [52, -290], [12, -290]], stoneHi);

  // Left Arm Holding Palm-Leaf Manuscript (Thirukkural Olai Chuvadi) at Waist
  DK.seg(g, [[-52, -365], [-68, -320], [-36, -308]], 20, stoneCol);
  DK.rr(g, -48, -318, 42, 14, 4);
  g.fillStyle = '#FFE094';
  g.fill();

  // Iconic Right Arm Raised in 3-Finger Gesture (Aram, Porul, Inbam)
  DK.seg(g, [[50, -365], [76, -395], [64, -442]], 19, stoneHi);
  DK.circle(g, 64, -448, 11, stoneHi);
  DK.seg(g, [[60, -455], [60, -472]], 4, stoneHi);
  DK.seg(g, [[65, -455], [65, -474]], 4, stoneHi);
  DK.seg(g, [[70, -455], [70, -470]], 4, stoneHi);

  // Sculpted Head, Flowing Sage Beard & High Jata Makuta Topknot Bun
  DK.circle(g, 0, -424, 34, DK.sphereGrad(g, 0, -424, 34, stoneHi, [-0.5, -0.8], 0.22));
  // Tiered Sage Bun (Kondai)
  DK.circle(g, 0, -462, 20, DK.sphereGrad(g, 0, -462, 20, stoneCol));
  DK.circle(g, 0, -478, 12, stoneHi);
  // Long Sculpted Beard
  DK.poly(g, [[-22, -412], [22, -412], [14, -368], [0, -356], [-14, -368]], stoneHi);
  // Serene Stone Eyes & Vibhuti Forehead Lines
  DK.seg(g, [[-14, -438], [14, -438]], 2.5, stoneSh);
  DK.seg(g, [[-16, -428], [-6, -428]], 3, stoneSh);
  DK.seg(g, [[6, -428], [16, -428]], 3, stoneSh);

  g.restore();

  // Foreground Kanyakumari Coastal Stone Promenade & Sea Wall
  DK.rr(g, -120, 845, 2160, 260, 0);
  g.fillStyle = DK.linGrad(g, 0, 845, 0, 1080, ['#1A243B', '#0D1322']);
  g.fill();
  DK.seg(g, [[-120, 845], [2040, 845]], 4, 'rgba(168, 240, 255, 0.35)');
  for (let bx = 120; bx <= 1800; bx += 210) {
    DK.rr(g, bx - 14, 808, 28, 38, 6);
    g.fillStyle = '#283654';
    g.fill();
    DK.circle(g, bx, 804, 10, '#3B4F78');
  }
}

  const wallCol = goldenFinale ? '#4A3423' : '#3E324E';

  [180, 1740].forEach((px) => {
    DK.rr(g, px - 28, 120, 56, 720, 8);
    g.fillStyle = DK.cylinderGrad(g, px - 28, 120, px + 28, 120, goldenFinale ? '#8C6239' : '#584870', -1);
    g.fill();
    DK.rr(g, px - 38, 120, 76, 28, 6);

  // 3 Illuminated Shelf Tiers
  for (let tier = 0; tier < 3; tier++) {

            hairColor: '#261C1A',
            wardrobe: 'sweater',
            topColor: '#FF851B',
            bottomColor: '#28808C',
            allowModern: true,
            pose: { preset: lt < 2.4 ? 'celebrate' : 'wave', wave: true },
            eyeMode: 'happyArch',
            brows: 'raised',
            mouth: 'laugh',
            t: gt,
            seed: 1252,
          });

          // 3. Right: CHAR_RAJARAJA_CHOLA marching in from right (1640 -> 1300) and waving
          DK.char(g, {
            moveX: [1640, 1300, lt, 4.8],
            y: 850,
            s: 1.02,
            flipX: true,
            skin: '#C88C68',
            hairStyle: 'bun',
            hairColor: '#1A1615',
            wardrobe: 'ancientTamil',
            topColor: '#F7B928',
            bottomColor: '#F4EFE6',
            headwear: 'crown',
            beard: true,
            mustache: true,
            foreheadMark: 'vibhuti',
            prop: 'scroll',
            pose: { preset: lt < 2.4 ? 'march' : 'wave', wave: lt >= 2.4 },
            eyeMode: 'warm',
            brows: 'raised',
            mouth: 'smile',
            t: gt,
            seed: 1253,
          });
        },
        fgBokehDepth: 1.45,
        fgBokehBlur: 12,
        fgBokeh: (g) => {
          FX.bokehOrbs(g, gt, { seed: 125, count: 18, color: '#FFD59A', a: 0.22 });
          FX.dust(g, gt, { seed: 125, count: 60, color: '#FFE9D2', a: 0.45 });
        },
      });

      DK.finishFrame(g, gt, { vignette: 0.38, grain: 0.03 });
    },
  },
];

// ============================================================================
// PER-SHOT PROCEDURAL SFX & AMBIENT BEDS ONLY (ZERO BGM)
// ============================================================================
function scoreSound(k) {
  const bs = SHOTS[0].start; // 478.3s

  // --- SHOT 121 (gt: 478.3s – 481.0s | bt: 0.0s – 2.7s) ---
  {
    const bt = 478.3 - bs;
    k.bed('wind', bt + 0.0, bt + 2.7, { gain: 0.65 });
    k.play('footstep', bt + 0.2, { n: 4, rate: 0.45 });
    k.play('pillBadge', bt + 0.15, { f: 'G5', gain: 0.75 });
  }

  // --- SHOT 122 (gt: 481.0s – 486.1s | bt: 2.7s – 7.8s) ---
  {
    const bt = 481.0 - bs;
    k.bed('ocean', bt + 0.0, bt + 5.1, { gain: 0.85 });
    k.play('starShimmer', bt + 0.4, { gain: 0.85 });
    k.play('templeBell', bt + 2.55, { f: 'C5', gain: 0.9 });
  }

  // --- SHOT 123 (gt: 486.1s – 489.7s | bt: 7.8s – 11.4s) ---
  {
    const bt = 486.1 - bs;
    k.bed('room', bt + 0.0, bt + 3.6, { gain: 0.55 });
    k.play('footstep', bt + 0.2, { n: 5, rate: 0.42 });
    k.play('pop', bt + 1.80, { f: 640, gain: 0.85, pan: 0.3 });
  }

  // --- SHOT 124 (gt: 489.7s – 493.0s | bt: 11.4s – 14.7s) ---
  {
    const bt = 489.7 - bs;
    k.bed('room', bt + 0.0, bt + 3.3, { gain: 0.55 });
    k.play('footstep', bt + 0.2, { n: 4, rate: 0.45, pan: -0.15 });
    k.play('pillBadge', bt + 1.65, { f: 'A5', pan: 0.25 });
  }

  // --- SHOT 125 (gt: 493.0s – 497.8s | bt: 14.7s – 19.5s) ---
  {
    const bt = 493.0 - bs;
    k.bed('room', bt + 0.0, bt + 4.8, { gain: 0.55 });
    k.play('footstep', bt + 0.2, { n: 5, rate: 0.42 });
    k.play('templeBell', bt + 0.35, { f: 'C5', gain: 0.85 });
    k.play('starShimmer', bt + 2.40, { gain: 0.9 });
  }

  // Automatic 3D-Parallax Boundary Transition SFX
  if (window.DK && DK.scheduleTransitions) {
    DK.scheduleTransitions(k, SHOTS, bs, THEME);
  }
}

// ============================================================================
// STUDIO PLAYER & HEADLESS RENDER HOOK BOILERPLATE
// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;
window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;
let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});

window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
