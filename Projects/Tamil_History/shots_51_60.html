// Helper: Draw Chola Tiger Standards / Royal Banners along avenues
function drawCholaTigerBanner(g, x, y, s = 1, t = 0) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  const wave = Math.sin(t * 4.5 + x * 0.01) * 10;
  // Bronze flagpole + finial
  DK.seg(g, [[0, 0], [0, -320]], 8, '#8C5832');
  DK.circle(g, 0, -328, 12, '#FFD54F');
  // Crimson & Saffron Royal Chola Pennant
  DK.poly(
    g,
    [
      [0, -310],
      [135, -295 + wave],
      [110, -245 + wave * 0.8],
      [140, -195 + wave],
      [0, -205],
    ],
    '#C92A2A',
    '#FFD54F',
    3
  );
  // Stylized Golden Jumping Tiger Emblem (Puli Kodi)
  DK.ellipse(g, 58, -254 + wave * 0.5, 24, 10, '#FFD54F', -0.18);
  DK.circle(g, 82, -262 + wave * 0.6, 9, '#FFD54F');
  DK.seg(g, [[34, -252 + wave * 0.4], [18, -268 + wave * 0.3]], 4, '#FFD54F');
  g.restore();
}

// Helper: Draw Monumental 216-ft, 13-Tiered Brihadeeswarar Temple Vimana (Shots 56 & 58)
function drawBrihadeeswararVimana(g, cx, baseY, s = 1, o = {}) {
  const { underConstruction = false, t = 0 } = o;
  g.save();
  g.translate(cx, baseY);
  g.scale(s, s);

  // Base Adhishthana & Double-Storey Sanctum Wall (Srivimana Base)
  const baseW = 540;
  const baseH = 150;
  DK.rr(g, -baseW / 2, -baseH, baseW, baseH, 8);
  g.fillStyle = DK.cylinderGrad(g, -baseW / 2, -baseH, baseW / 2, 0, '#A67249', -1);
  g.fill();
  g.strokeStyle = '#6E472B';
  g.lineWidth = 3;
  g.stroke();

  // Carved Pilasters & Niches on Base Wall
  for (let i = -4; i <= 4; i++) {
    const px = i * 54;
    DK.rr(g, px - 10, -baseH + 14, 20, baseH - 22, 4);
    g.fillStyle = DK.shade('#A67249', i % 2 === 0 ? 0.1 : -0.12);
    g.fill();
  }

  // 13 Stepped Pyramid Tiers (Talas) Rising to 216 Feet
  const tiers = 13;
  const totalPyramidH = 440;
  const tierH = totalPyramidH / tiers;
  for (let i = 0; i < tiers; i++) {
    const u0 = i / tiers;
    const u1 = (i + 1) / tiers;
    const w0 = DK.lerp(baseW * 0.92, 148, u0);
    const w1 = DK.lerp(baseW * 0.92, 148, u1);
    const y0 = -baseH - i * tierH;
    const y1 = y0 - tierH;
    const tierCol = DK.shade('#B88256', (i % 2) * 0.06 - 0.04);

    DK.poly(
      g,
      [
        [-w0 / 2, y0],
        [w0 / 2, y0],
        [w1 / 2, y1],
        [-w1 / 2, y1],
      ],
      DK.cylinderGrad(g, -w0 / 2, y1, w0 / 2, y0, tierCol, -1),
      '#6E472B',
      1.8
    );

    // Kudu / Sala miniature shrines along each tier cornice
    const shrines = Math.max(3, 9 - Math.floor(i * 0.5));
    for (let k = 0; k < shrines; k++) {
      const sx = DK.lerp(-w1 * 0.42, w1 * 0.42, k / Math.max(1, shrines - 1));
      DK.rr(g, sx - 6, y1 + 4, 12, tierH - 6, 3);
      g.fillStyle = '#D9A16C';
      g.fill();
    }
  }

  // Top Platform (Griva) + Nandi Bulls at Corners
  const topY = -baseH - totalPyramidH;
  DK.rr(g, -82, topY - 22, 164, 22, 4);
  g.fillStyle = '#9C6840';
  g.fill();

  // 80-Ton Octagonal Cupola (Kumbam / Shikhara)
  g.beginPath();
  g.moveTo(-78, topY - 22);
  g.bezierCurveTo(-92, topY - 88, -38, topY - 112, 0, topY - 112);
  g.bezierCurveTo(38, topY - 112, 92, topY - 88, 78, topY - 22);
  g.closePath();
  g.fillStyle = DK.sphereGrad(g, 0, topY - 68, 86, '#C89262', [-0.6, -0.75], 0.22);
  g.fill();
  g.strokeStyle = '#FFD54F';
  g.lineWidth = 2.5;
  g.stroke();

  // Gold-Plated Copper Kalasam Finial (12.5 ft tall)
  if (!underConstruction) {
    DK.glow(g, 0, topY - 138, 64, '#FFD54F', 0.75);
    DK.seg(g, [[0, topY - 112], [0, topY - 164]], 7, '#FFD54F');
    DK.circle(g, 0, topY - 126, 13, '#FFD54F');
    DK.circle(g, 0, topY - 144, 9, '#FFF3B0');
    DK.circle(g, 0, topY - 164, 5, '#FFFFFF');
  } else {
    // Timber & Bamboo Scaffolding Lattice around Upper Tiers (Shot 58)
    g.strokeStyle = 'rgba(217, 168, 108, 0.65)';
    g.lineWidth = 3;
    for (let sx = -240; sx <= 240; sx += 60) {
      g.beginPath();
      g.moveTo(sx, 0);
      g.lineTo(sx * 0.45, topY - 90);
      g.stroke();
    }
    for (let sy = -80; sy >= topY - 60; sy -= 55) {
      const span = DK.lerp(260, 110, Math.abs(sy) / 620);
      g.beginPath();
      g.moveTo(-span, sy);
      g.lineTo(span, sy);
      g.stroke();
    }
  }

  g.restore();
}

// Helper: Draw Uthiramerur Stone Dais & Kudavolai Terracotta Ballot Pot (Shot 54)
function drawKudavolaiPotAndDais(g, x, y, lt) {
  g.save();
  g.translate(x, y);

  // Uthiramerur Inscription Stone Wall Backdrop
  DK.rr(g, -280, -340, 560, 260, 10);
  g.fillStyle = DK.cylinderGrad(g, -280, -340, 280, -80, '#6E5A48', -1);
  g.fill();
  g.strokeStyle = '#9C846C';
  g.lineWidth = 3;
  g.stroke();

  // Carved Tamil-Brahmi / Vatteluttu / Chola Grantha Inscription Lines on Stone Wall
  g.strokeStyle = 'rgba(255, 235, 195, 0.35)';
  g.lineWidth = 2;
  for (let row = 0; row < 7; row++) {
    const ry = -310 + row * 30;
    g.beginPath();
    g.moveTo(-240, ry);
    g.lineTo(240, ry);
    g.stroke();
  }

  // Stepped Stone Sabha Dais
  DK.contactShadow(g, 0, 96, 190, 18, 0.38);
  DK.rr(g, -170, 35, 340, 62, 8);
  g.fillStyle = '#7C6652';
  g.fill();
  DK.rr(g, -130, -10, 260, 48, 8);
  g.fillStyle = '#8F7760';
  g.fill();

  // Sacred Brass Oil Lamps (Kuthuvilakku) Flanking the Pot
  [-105, 105].forEach((lx) => {
    DK.seg(g, [[lx, -10], [lx, -85]], 6, '#D99B26');
    DK.ellipse(g, lx, -10, 18, 6, '#B87333');
    DK.ellipse(g, lx, -85, 16, 5, '#FFD54F');
    DK.glow(g, lx, -96, 32, '#FFAE38', 0.85);
    DK.circle(g, lx, -94, 6, '#FFF5D6');
  });

  // Terracotta Kudavolai Ballot Pot (குடவோலை)
  DK.circle(g, 0, -56, 46, DK.sphereGrad(g, 0, -56, 46, '#D96B27', [-0.6, -0.75], 0.22));
  // Decorative white & gold ceremonial bands on pot
  DK.seg(g, [[-43, -58], [43, -58]], 4, '#FFF6D6');
  DK.seg(g, [[-38, -44], [38, -44]], 3, '#FFD54F');
  // Pot Neck & Rim
  DK.rr(g, -28, -108, 56, 18, 8);
  g.fillStyle = '#B85218';
  g.fill();
  DK.ellipse(g, 0, -108, 30, 8, '#6E2B0C');

  // Animated Palm-Leaf Ballot (ஓலைச்சுவடி) Dropping into the Pot at lt = 1.6..2.3s
  const dropU = DK.clamp((lt - 1.55) / 0.55, 0, 1);
  if (dropU > 0 && dropU < 1) {
    const by = DK.lerp(-185, -108, DK.ease.inOut(dropU));
    g.save();
    g.translate(0, by);
    g.rotate(0.25 * (1 - dropU));
    DK.rr(g, -22, -8, 44, 16, 3);
    g.fillStyle = '#F5D796';
    g.fill();
    g.strokeStyle = '#B38B4D';
    g.lineWidth = 2;
    g.stroke();
    g.restore();
  }
  if (lt >= 1.95) {
    DK.glow(g, 0, -112, 48 * (1 - DK.clamp((lt - 1.95) / 0.8, 0, 1)), '#FFD54F', 0.8);
  }

  g.restore();
}

    k.play('footstep', gt0 + 0.35, { n: 8, rate: 0.44 });
    k.play('pillBadge', gt0 + 2.35, { f: 'C6' });
  }

  // Automatic 2-Phase Boundary Transition SFX
  if (window.DK && DK.scheduleTransitions) {
    DK.scheduleTransitions(k, SHOTS, B0, window.THEME);
  }
}

// ============================================================================
// STUDIO PLAYER & DETERMINISTIC HEADLESS RENDER HOOKS
// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;
window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;
let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});

window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
</body></html>
