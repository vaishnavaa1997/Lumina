function drawLegoBrick3D(g, x, y, w, h, baseCol, studs = 4) {
  g.save();
  g.translate(x, y);
  // Top studs
  const studSpacing = w / (studs + 0.6);
  const startX = -((studs - 1) * studSpacing) * 0.5;
  for (let i = 0; i < studs; i++) {
    const sx = startX + i * studSpacing;
    DK.rr(g, sx - 20, -h * 0.5 - 20, 40, 24, 6);
    g.fillStyle = DK.cylinderGrad(g, sx - 20, -h * 0.5 - 20, sx + 20, -h * 0.5, DK.shade(baseCol, 0.12), -1);
    g.fill();
    DK.ellipse(g, sx, -h * 0.5 - 18, 20, 6, DK.shade(baseCol, 0.25));
  }
  // Main 3D brick body
  DK.rr(g, -w * 0.5, -h * 0.5, w, h, 10);
  g.fillStyle = DK.cylinderGrad(g, -w * 0.5, -h * 0.5, w * 0.5, h * 0.5, baseCol, -1);
  g.fill();
  g.strokeStyle = DK.shade(baseCol, 0.25);
  g.lineWidth = 3;
  g.stroke();
  // Specular highlight strip
  DK.rr(g, -w * 0.45, -h * 0.4, w * 0.9, 12, 6);
  g.fillStyle = 'rgba(255,255,255,0.28)';
  g.fill();
  g.restore();
}

function drawCholaInterlockBlock(g, x, y, w, h, isTop, lockProg) {
  g.save();
  g.translate(x, y);
  const baseCol = '#7C879B';
  const darkCol = '#545E70';
  const hiCol = '#A6B2C7';

  if (!isTop) {
    // Bottom Block with Mortise Socket Groove
    DK.poly(
      g,
      [
        [-w * 0.5, -h * 0.5],
        [-58, -h * 0.5],
        [-46, -h * 0.5 + 38],
        [46, -h * 0.5 + 38],
        [58, -h * 0.5],
        [w * 0.5, -h * 0.5],
        [w * 0.5, h * 0.5],
        [-w * 0.5, h * 0.5],
      ],
      DK.cylinderGrad(g, -w * 0.5, -h * 0.5, w * 0.5, h * 0.5, baseCol, -1),
      hiCol,
      3
    );
    // Socket interior shadow
    DK.poly(g, [[-56, -h * 0.5], [-46, -h * 0.5 + 38], [46, -h * 0.5 + 38], [56, -h * 0.5]], darkCol);
  } else {
    // Top Block with Tenon Dovetail Projection
    DK.poly(
      g,
      [
        [-w * 0.5, -h * 0.5],
        [w * 0.5, -h * 0.5],
        [w * 0.5, h * 0.5],
        [54, h * 0.5],
        [44, h * 0.5 + 36],
        [-44, h * 0.5 + 36],
        [-54, h * 0.5],
        [-w * 0.5, h * 0.5],
      ],
      DK.cylinderGrad(g, -w * 0.5, -h * 0.5, w * 0.5, h * 0.5, '#8A96AC', -1),
      hiCol,
      3
    );
  }
  // Carved Tamil mason marks & stone texture lines
  DK.seg(g, [[-w * 0.35, 0], [w * 0.35, 0]], 2, 'rgba(255,255,255,0.18)');
  if (lockProg > 0.92) {
    DK.seg(g, [[-w * 0.48, isTop ? h * 0.5 : -h * 0.5], [w * 0.48, isTop ? h * 0.5 : -h * 0.5]], 3.5, '#FFD54F');
  }
  g.restore();
}

function drawBrihadeeswararVimana(g, cx, baseY, scale = 1.0) {
  g.save();
  g.translate(cx, baseY);
  g.scale(scale, scale);

  // Base Adhishthana plinth
  DK.rr(g, -230, -110, 460, 110, 8);
  g.fillStyle = DK.cylinderGrad(g, -230, -110, 230, 0, '#9E6B43', -1);
  g.fill();

  // 13 Stepped Pyramid Tiers of the 216-ft Srivimana
  const tiers = 13;
  for (let i = 0; i < tiers; i++) {
    const u = i / tiers;
    const tw = DK.lerp(380, 128, u);
    const th = 34;
    const ty = -110 - (i + 1) * th;
    const col = DK.shade('#B87D4B', (i % 2) * 0.06);
    DK.rr(g, -tw * 0.5, ty, tw, th - 2, 4);
    g.fillStyle = DK.cylinderGrad(g, -tw * 0.5, ty, tw * 0.5, ty + th, col, -1);
    g.fill();
    // Miniature Kudu arches along tier
    const archCount = Math.max(3, Math.floor(tw / 48));
    for (let k = 0; k < archCount; k++) {
      const ax = -tw * 0.4 + (k / Math.max(1, archCount - 1)) * tw * 0.8;
      DK.circle(g, ax, ty + th * 0.5, 5, '#6B4226');
    }
  }

  // 80-Ton Octagonal Monolithic Capstone (Kumbam / Shikharam)
  const capY = -110 - tiers * 34;
  DK.poly(
    g,
    [
      [-76, capY],
      [76, capY],
      [92, capY - 26],
      [58, capY - 64],
      [-58, capY - 64],
      [-92, capY - 26],
    ],
    DK.sphereGrad(g, 0, capY - 32, 90, '#C98A4B')
  );

  // Sacred Gold Kalasam Finial
  DK.glow(g, 0, capY - 92, 55, '#FFD54F', 0.75);
  DK.seg(g, [[0, capY - 64], [0, capY - 118]], 8, '#FFD54F');
  DK.circle(g, 0, capY - 82, 16, '#FFD54F');
  DK.circle(g, 0, capY - 102, 10, '#FFF3B0');

  g.restore();
}

  DK.poly(

      [115, -8],
      [140, -42],
      [-135, -38],

  // Mast & Billowing Saffron-Cream Sail with Tiger Crest

  DK.poly(g, [[0, -195], [46, -188 + billow * 0.5], [0, -178]], '#E53935');
  g.restore();

// ============================================================================
// STUDIO PLAYER & HEADLESS RENDER HOOK BOILERPLATE
// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;
window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();

  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});
shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});
document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});

window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
