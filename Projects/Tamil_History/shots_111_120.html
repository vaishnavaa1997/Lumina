function drawMeenakshiGopuram(g, x, y, s = 1) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  const tiers = 7;
  const baseW = 250;
  const tierH = 48;
  for (let i = 0; i < tiers; i++) {
    const u = i / tiers;
    const w0 = DK.lerp(baseW, 92, u);
    const w1 = DK.lerp(baseW, 92, (i + 1) / tiers);
    const ty = -i * tierH;
    const cols = ['#A84832', '#28808C', '#C98A2C', '#8C3838'];
    const c = cols[i % cols.length];
    DK.poly(g, [[-w0 / 2, ty], [w0 / 2, ty], [w1 / 2, ty - tierH + 4], [-w1 / 2, ty - tierH + 4]], DK.cylinderGrad(g, -w0 / 2, ty - tierH, w0 / 2, ty, c, -1));
    DK.rr(g, -w0 * 0.52, ty - tierH, w0 * 1.04, 8, 3);
    g.fillStyle = '#FFD54F';
    g.fill();
    for (let k = -2; k <= 2; k++) {
      DK.rr(g, k * (w1 * 0.16) - 5, ty - tierH + 12, 10, 26, 4);
      g.fillStyle = DK.shade(c, -0.25);
      g.fill();
    }
  }
  const topY = -tiers * tierH;
  DK.rr(g, -54, topY - 26, 108, 26, 12);
  g.fillStyle = '#B87333';
  g.fill();
  for (let f = -2; f <= 2; f++) {
    DK.circle(g, f * 18, topY - 34, 6, '#FFD54F');
  }
  // Open Golden Temple Archway at Base
  DK.rr(g, -42, -96, 84, 96, 38);
  g.fillStyle = '#181018';
  g.fill();
  DK.glow(g, 0, -48, 68, '#FFD54F', 0.65);
  g.restore();
}

function drawUniversityClocktower(g, x, y, s = 1) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  // Indo-Saracenic Red Brick & Sandstone University Hall + Clocktower
  DK.rr(g, -170, -180, 340, 180, 8);
  g.fillStyle = DK.cylinderGrad(g, -170, -180, 170, 0, '#9E382E', -1);
  g.fill();
  for (let i = -2; i <= 2; i++) {
    DK.rr(g, i * 58 - 18, -120, 36, 120, 18);
    g.fillStyle = '#24181C';
    g.fill();
  }
  DK.rr(g, -48, -370, 96, 370, 6);
  g.fillStyle = DK.cylinderGrad(g, -48, -370, 48, 0, '#B04238', -1);
  g.fill();
  // Dome & Finial
  g.beginPath();
  g.arc(0, -370, 48, Math.PI, 0);
  g.fillStyle = '#D99B26';
  g.fill();
  DK.seg(g, [[0, -418], [0, -448]], 4, '#FFD54F');
  // Clock Face
  DK.circle(g, 0, -305, 28, '#FFF8E7');
  DK.ring(g, 0, -305, 28, 4, '#D99B26');
  DK.seg(g, [[0, -305], [0, -322]], 3, '#1E293B');
  DK.seg(g, [[0, -305], [14, -305]], 3, '#1E293B');
  g.restore();
}

function drawIndianTricolorFlag(g, poleX, poleBottomY, poleTopY, flagY, t) {
  DK.seg(g, [[poleX, poleBottomY], [poleX, poleTopY]], 8, '#CBD5E1');
  DK.circle(g, poleX, poleTopY - 6, 10, '#FFD54F');
  const fw = 180, fh = 114;
  const wave = Math.sin(t * 5.5) * 10;
  g.save();
  g.translate(poleX + 4, flagY);
  // Saffron Top Band
  DK.poly(g, [[0, 0], [fw, wave], [fw, fh / 3 + wave], [0, fh / 3]], '#FF7722');
  // White Middle Band
  DK.poly(g, [[0, fh / 3], [fw, fh / 3 + wave], [fw, (fh * 2) / 3 + wave], [0, (fh * 2) / 3]], '#FFFFFF');
  // India Green Bottom Band
  DK.poly(g, [[0, (fh * 2) / 3], [fw, (fh * 2) / 3 + wave], [fw, fh + wave], [0, fh]], '#138808');
  // Navy Ashoka Chakra
  const cx = fw * 0.5, cy = fh * 0.5 + wave * 0.5;
  DK.ring(g, cx, cy, 15, 2.5, '#000080');
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    DK.seg(g, [[cx - Math.cos(a) * 14, cy - Math.sin(a) * 14], [cx + Math.cos(a) * 14, cy + Math.sin(a) * 14]], 1.4, '#000080');
  }
  g.restore();
}

function drawBicycleProp(g, x, y, s, t) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  const wR = 34;
  const rot = t * 6.5;
  [-58, 58].forEach((wx) => {
    DK.ring(g, wx, -wR, wR, 5, '#1E293B');
    DK.ring(g, wx, -wR, wR - 4, 2, '#CBD5E1');
    for (let i = 0; i < 6; i++) {
      const a = rot + (i / 6) * Math.PI * 2;
      DK.seg(g, [[wx, -wR], [wx + Math.cos(a) * (wR - 4), -wR + Math.sin(a) * (wR - 4)]], 1.8, '#94A3B8');
    }
  });
  // Frame
  DK.seg(g, [[-58, -wR], [-8, -wR], [28, -wR - 46], [-32, -wR - 46], [-58, -wR]], 5, '#2E6BE6');
  DK.seg(g, [[-8, -wR], [-32, -wR - 58]], 5, '#2E6BE6');
  DK.seg(g, [[58, -wR], [24, -wR - 64], [10, -wR - 68]], 5, '#CBD5E1');
  DK.rr(g, -44, -wR - 64, 26, 9, 4);
  g.fillStyle = '#1E293B';
  g.fill();
  g.restore();
}

function drawWindTurbine(g, x, y, s, t, seed = 1) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  DK.seg(g, [[0, 0], [0, -240]], 10, '#E2E8F0');
  g.translate(0, -240);
  g.rotate(t * 2.8 + seed);
  for (let i = 0; i < 3; i++) {
    g.save();
    g.rotate((i * Math.PI * 2) / 3);
    DK.poly(g, [[-4, 0], [4, 0], [2, -96], [-2, -96]], '#F8FAFC');
    g.restore();
  }
  DK.circle(g, 0, 0, 9, '#CBD5E1');
  g.restore();
}

function drawModernCar(g, x, y, s, bodyCol = '#00F2FE') {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  DK.contactShadow(g, 0, 8, 125, 14, 0.35);
  DK.poly(
    g,
    [
      [-115, -24],
      [-95, -62],
      [-35, -96],
      [48, -96],
      [98, -58],
      [120, -24],
    ],
    DK.linGrad(g, 0, -96, 0, -24, [DK.shade(bodyCol, 0.25), bodyCol, DK.shade(bodyCol, -0.25)])
  );
  DK.rr(g, -124, -44, 248, 36, 14);
  g.fillStyle = bodyCol;
  g.fill();
  // Windows
  DK.poly(g, [[-78, -58], [-32, -88], [42, -88], [82, -58]], '#162447');
  // Headlight glow
  DK.circle(g, 116, -34, 7, '#FFF9C4');
  // Wheels
  [-74, 74].forEach((wx) => {
    DK.circle(g, wx, -12, 24, '#1E293B');
    DK.circle(g, wx, -12, 12, '#94A3B8');
  });
  g.restore();
}

  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});
shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});
document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});
window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
</body></html>
