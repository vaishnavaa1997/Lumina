// British East India Company Square-Rigged Tall Ship (Shots 85 & 86)
function drawBritishTallShip(g, x, y, s = 1, t = 0) {
  g.save();
  g.translate(x, y + Math.sin(t * 1.8) * 6 * s);
  g.rotate(Math.sin(t * 1.4) * 0.025);
  g.scale(s, s);

  // Water reflection & wake
  FX.pool(g, 0, 26, 260, 22, '#dce6f2', 0.25);

  // Masts & Square Sails
  const masts = [
    { mx: -95, mh: 260, sw: 95 },
    { mx: 0, mh: 320, sw: 125 },
    { mx: 95, mh: 240, sw: 85 },
  ];
  masts.forEach((m, idx) => {
    DK.seg(g, [[m.mx, 0], [m.mx, -m.mh]], 8, '#4a3525');
    // Lower & Upper billowing square sails
    [0.42, 0.78].forEach((uY, sIdx) => {
      const sy = -m.mh * uY;
      const sh = m.mh * 0.28;
      const sw = m.sw * (sIdx === 1 ? 0.78 : 1.0);
      const billow = 12 + Math.sin(t * 2.5 + idx + sIdx) * 4;
      DK.seg(g, [[m.mx - sw * 0.55, sy - sh * 0.5], [m.mx + sw * 0.55, sy - sh * 0.5]], 5, '#5c4028');
      g.beginPath();
      g.moveTo(m.mx - sw * 0.5, sy - sh * 0.5);
      g.lineTo(m.mx + sw * 0.5, sy - sh * 0.5);
      g.quadraticCurveTo(m.mx + sw * 0.5 + billow, sy, m.mx + sw * 0.48, sy + sh * 0.5);
      g.lineTo(m.mx - sw * 0.48, sy + sh * 0.5);
      g.quadraticCurveTo(m.mx - sw * 0.5 + billow, sy, m.mx - sw * 0.5, sy - sh * 0.5);
      g.closePath();
      g.fillStyle = DK.linGrad(g, m.mx - sw * 0.5, sy, m.mx + sw * 0.5, sy, ['#f8fafc', '#e2e8f0', '#cbd5e1']);
      g.fill();
    });
  });

  // Bowsprit
  DK.seg(g, [[-140, -28], [-235, -75]], 7, '#4a3525');

  // Red & White Striped EIC Ensign Flag on Mainmast
  const fw = 58, fh = 32;
  const wave = Math.sin(t * 6) * 5;
  DK.poly(g, [[0, -320], [-fw, -315 + wave], [-fw, -320 + fh + wave], [0, -320 + fh]], '#C92A2A');
  DK.seg(g, [[0, -310], [-fw, -306 + wave]], 4, '#FFFFFF');
  DK.seg(g, [[0, -298], [-fw, -294 + wave]], 4, '#FFFFFF');
  g.fillStyle = '#1E3A8A';
  g.fillRect(-22, -320, 22, 16);

  // Wooden Hull with Gunports & Gold Trim
  DK.poly(
    g,
    [
      [-175, -36],
      [185, -48],
      [150, 18],
      [-145, 18],
    ],
    DK.cylinderGrad(g, -175, -45, -175, 18, '#4E3424', -1),
    '#2B1B12',
    3
  );
  // Gold gunwale stripe
  DK.seg(g, [[-168, -20], [176, -26]], 6, '#F5B942');
  // Cannon gunports
  for (let gx = -110; gx <= 110; gx += 36) {
    g.fillStyle = '#141218';
    g.fillRect(gx - 6, -12, 12, 10);
  }

  g.restore();
}

// Stone Fort Bastion for the 72 Palayams (Shot 83)
function drawPalayamBastion(g, x, y, w = 260, h = 340, wallCol = '#4A3F55', bannerCol = '#E53935', label = '', t = 0) {
  g.save();
  g.translate(x, y);

  // Main stone tower body
  DK.rr(g, -w * 0.5, -h, w, h, 8);
  g.fillStyle = DK.cylinderGrad(g, -w * 0.5, -h, w * 0.5, 0, wallCol, -1);
  g.fill();
  g.strokeStyle = DK.shade(wallCol, -0.25);
  g.lineWidth = 3;
  g.stroke();

  // Crenellations / Battlements along top
  const merlons = 5;
  const mw = (w + 24) / (merlons * 1.6);
  for (let i = 0; i < merlons; i++) {
    const mx = -w * 0.5 - 6 + i * mw * 1.65;
    DK.rr(g, mx, -h - 28, mw, 30, 4);
    g.fillStyle = DK.shade(wallCol, 0.08);
    g.fill();
  }

  // Arched Fort Gate
  DK.rr(g, -46, -135, 92, 135, 44);
  g.fillStyle = '#1B1622';
  g.fill();
  g.strokeStyle = '#8C7A6B';
  g.lineWidth = 4;
  g.stroke();

  // Regional Flagpole & Waving Banner
  DK.seg(g, [[0, -h - 28], [0, -h - 145]], 6, '#CBD5E1');
  const wave = Math.sin(t * 5.5 + x * 0.01) * 8;
  DK.poly(
    g,
    [
      [0, -h - 142],
      [96, -h - 132 + wave],
      [78, -h - 108 + wave * 0.6],
      [96, -h - 86 + wave],
      [0, -h - 86],
    ],
    bannerCol
  );
  DK.circle(g, 34, -h - 114 + wave * 0.4, 10, '#FFD54F');

  if (label) {
    DK.rr(g, -92, -h + 26, 184, 34, 17);
    g.fillStyle = 'rgba(15, 20, 36, 0.88)';
    g.fill();
    g.strokeStyle = bannerCol;
    g.lineWidth = 2;
    g.stroke();
    DK.text(g, label, 0, -h + 43, { size: 17, weight: 800, color: '#FFFFFF' });
  }

  g.restore();
}

    k.play('coinClink', bt + 1.85, { n: 5, pan: 0.25 });
  }

  // --- SHOT 82 (gt: 310.6s – 314.7s | bt: 3.7s – 7.8s) ---
  {
    const bt = 310.6 - B0;
    k.bed('volcanoLava', bt + 0.0, bt + 4.1, { gain: 0.9 });
    k.play('impact', bt + 0.15, { gain: 0.95, pan: 0.3 });
    k.play('swordClash', bt + 1.1, { gain: 0.85, pan: -0.2 });
    k.play('shatter', bt + 2.05, { gain: 0.9, pan: 0.35 });
  }

  // --- SHOT 83 (gt: 314.7s – 318.3s | bt: 7.8s – 11.4s) ---
  {
    const bt = 314.7 - B0;
    k.bed('wind', bt + 0.0, bt + 3.6, { gain: 0.75 });
    k.play('whoosh', bt + 0.5, { dur: 0.35, gain: 0.7 });
    k.play('thud', bt + 1.80, { f: 130, gain: 0.8 });
  }

  // --- SHOT 84 (gt: 318.3s – 320.6s | bt: 11.4s – 13.7s) ---
  {
    const bt = 318.3 - B0;
    k.bed('wind', bt + 0.0, bt + 2.3, { gain: 0.8 });
    k.play('swordClash', bt + 0.65, { gain: 0.9, pan: -0.1 });
    k.play('swordClash', bt + 1.15, { gain: 1.0, pan: 0.1 });
  }

  // --- SHOT 85 (gt: 320.6s – 323.8s | bt: 13.7s – 16.9s) ---
  {
    const bt = 320.6 - B0;
    k.bed('ocean', bt + 0.0, bt + 3.2, { gain: 0.85 });
    k.play('footstep', bt + 0.3, { n: 5, rate: 0.44, pan: 0.35 });
    k.play('pop', bt + 1.60, { f: 520, gain: 0.65, pan: 0.25 });
  }

  // --- SHOT 86 (gt: 323.8s – 329.9s | bt: 16.9s – 23.0s) ---
  {
    const bt = 323.8 - B0;
    k.bed('ocean', bt + 0.0, bt + 6.1, { gain: 0.75 });
    k.play('coinClink', bt + 1.2, { n: 3, pan: -0.2 });
    k.play('hammerHit', bt + 2.0, { n: 5, rate: 0.45, pan: 0.35 });
    k.play('whoosh', bt + 3.05, { dur: 0.35, pan: 0.35 });
  }

  // --- SHOT 87 (gt: 329.9s – 334.6s | bt: 23.0s – 27.7s) ---
  {
    const bt = 329.9 - B0;
    k.bed('room', bt + 0.0, bt + 4.7, { gain: 0.75 });
    k.play('footstep', bt + 0.2, { n: 7, rate: 0.50 });
    k.play('seatbeltClick', bt + 2.35, { gain: 0.85 });
  }

  // --- SHOT 88 (gt: 334.6s – 339.4s | bt: 27.7s – 32.5s) ---
  {
    const bt = 334.6 - B0;
    k.bed('room', bt + 0.0, bt + 4.8, { gain: 0.5 });
    k.play('swordClash', bt + 0.9, { gain: 0.85, pan: -0.25 });
    k.play('thud', bt + 1.5, { f: 140, gain: 0.8, pan: -0.1 });
    k.play('whoosh', bt + 2.40, { dur: 0.3, top: 2000, pan: 0.2 });
    k.play('swordClash', bt + 3.6, { gain: 0.85, pan: 0.35 });
  }

  // --- SHOT 89 (gt: 339.4s – 344.8s | bt: 32.5s – 37.9s) ---
  {
    const bt = 339.4 - B0;
    k.bed('room', bt + 0.0, bt + 5.4, { gain: 0.65 });
    k.play('marchSteps', bt + 0.3, { n: 6, rate: 0.42, pan: 0.25 });
    k.play('toasterPop', bt + 2.70, { gain: 0.95 });
  }

  // --- SHOT 90 (gt: 344.8s – 347.1s | bt: 37.9s – 40.2s) ---
  {
    const bt = 344.8 - B0;
    k.play('impact', bt + 0.12, { gain: 0.95 });
    k.play('seatbeltClick', bt + 0.18, { gain: 0.8 });
  }

  // Automatic 2-Phase Boundary Transition SFX
  if (window.DK && DK.scheduleTransitions) {
    DK.scheduleTransitions(k, SHOTS, B0, THEME);
  }
}

// ============================================================================
// STUDIO PLAYER & HEADLESS RENDER HOOKS (SFX + AMBIENT ONLY)
// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;
window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();

  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});

window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
