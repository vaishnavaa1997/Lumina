function drawFortRamparts(g, y = 840, gt = 0, o = {}) {
  const { wallCol = '#6A3F2B', darkCol = '#3E2216', torches = true } = o;
  g.save();
  // Massive stone fort wall & battlements behind heroes
  DK.rr(g, -200, y - 340, 2320, 340, 8);
  g.fillStyle = DK.linGrad(g, 0, y - 340, 0, y, [wallCol, darkCol]);
  g.fill();

  // Crenellations (Merlons)
  for (let mx = -180; mx < 2100; mx += 110) {
    DK.rr(g, mx, y - 392, 68, 56, 6);
    g.fillStyle = wallCol;
    g.fill();
    DK.rr(g, mx + 6, y - 384, 56, 18, 4);
    g.fillStyle = DK.shade(wallCol, 0.14);
    g.fill();
  }

  // Stone block courses
  g.strokeStyle = 'rgba(20, 10, 6, 0.35)';
  g.lineWidth = 2;
  for (let row = 0; row < 5; row++) {
    const ry = y - 65 * (row + 1);
    g.beginPath();
    g.moveTo(-200, ry);
    g.lineTo(2120, ry);
    g.stroke();
  }

  // Blazing wall torches
  if (torches) {
    [260, 640, 960, 1280, 1660].forEach((tx, idx) => {
      const ty = y - 250;
      DK.seg(g, [[tx, ty + 45], [tx, ty]], 7, '#3E2723');
      const flick = 1 + Math.sin(gt * 11 + idx * 2.1) * 0.14;
      DK.glow(g, tx, ty - 14, 78 * flick, '#FF851B', 0.85);
      DK.poly(g, [[tx - 14 * flick, ty], [tx + 14 * flick, ty], [tx, ty - 42 * flick]], '#FFD54F');
    });
  }
  g.restore();
}

function drawBritishCannonSchematic(g, x, y, s, lt, gt) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);

  // Blueprint Measurement Grid Rings
  DK.ring(g, 0, -40, 220, 1.5, 'rgba(92, 225, 255, 0.25)');
  DK.ring(g, 0, -40, 160, 1.5, 'rgba(92, 225, 255, 0.18)');

  // Heavy Timber Gun Carriage & Trail (Facing Left)
  DK.poly(g, [[-40, -52], [180, 12], [195, 28], [-55, -24]], '#8C5832', '#5CE1FF', 2.5);
  DK.rr(g, -68, -72, 110, 36, 8);
  g.fillStyle = '#6E4224';
  g.fill();
  g.strokeStyle = '#5CE1FF';
  g.lineWidth = 2.5;
  g.stroke();

  // Cast Brass 12-Pounder Cannon Barrel (Angled Slightly Up-Left)
  g.save();
  g.translate(-25, -72);
  g.rotate(0.14);
  const recoil = lt >= 0.65 && lt < 0.95 ? Math.sin(((lt - 0.65) / 0.3) * Math.PI) * 28 : 0;
  g.translate(recoil, 0);
  DK.poly(
    g,
    [
      [-185, -18],
      [95, -28],
      [105, 28],
      [-185, 18],
    ],
    DK.cylinderGrad(g, 0, -28, 0, 28, '#D99B26', -1),
    '#FFE082',
    2.5
  );
  // Cascabel knob & muzzle ring
  DK.circle(g, 116, 0, 14, '#F5B942');
  DK.rr(g, -196, -24, 16, 48, 5);
  g.fillStyle = '#FFD54F';
  g.fill();
  g.restore();

  // Spoked Artillery Wheel
  const wx = -20, wy = -12, wr = 74;
  DK.circle(g, wx, wy, wr, 'rgba(14, 30, 64, 0.55)');
  DK.ring(g, wx, wy, wr, 10, '#C98A2C');
  DK.ring(g, wx, wy, wr + 5, 3, '#5CE1FF');
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2 + gt * 0.2;
    DK.seg(g, [[wx, wy], [wx + Math.cos(ang) * wr, wy + Math.sin(ang) * wr]], 5, '#B37A24');
  }
  DK.circle(g, wx, wy, 16, '#FFD54F');

  // Flintlock Musket Blueprint Above Cannon
  g.save();
  g.translate(40, -210);
  DK.seg(g, [[-190, 0], [110, 0]], 6, '#CBD5E1');
  DK.poly(g, [[40, 0], [145, 28], [155, 8], [65, -4]], '#8C5832', '#5CE1FF', 2);
  // Bayonet blade
  DK.poly(g, [[-190, -3], [-245, -1], [-190, 3]], '#5CE1FF');
  DK.text(g, 'FLINTLOCK MUSKET & BAYONET (.75 CAL)', 0, -28, { size: 18, font: DK.FONTS.mono, color: '#5CE1FF', weight: 700 });
  g.restore();

  DK.text(g, '12-POUNDER BRASS SIEGE ARTILLERY', 20, 95, { size: 20, font: DK.FONTS.mono, color: '#FFD54F', weight: 700 });
  g.restore();
}

function drawTamilNaduPalayamMap(g, cx, cy, s, annexProg = 0, gt = 0) {
  g.save();
  g.translate(cx, cy);
  g.scale(s, s);

  // Tamil Nadu Silhouette Polygon
  const tnPts = [
    [40, -310],
    [135, -260],
    [120, -110],
    [95, 20],
    [110, 95],
    [35, 165],
    [-15, 295],
    [-65, 325],
    [-95, 250],
    [-115, 110],
    [-165, -20],
    [-130, -165],
    [-45, -265],
  ];

  g.save();
  DK.poly(g, tnPts, '#16284C', '#5CE1FF', 4);
  g.clip();

  // 72 Divided Palayam Hexagonal Cells
  const r = DK.rng(950);
  for (let gx = -160; gx <= 140; gx += 46) {
    for (let gy = -300; gy <= 310; gy += 44) {
      const ox = gx + (Math.abs(gy) % 88 === 0 ? 22 : 0);
      const oy = gy;
      const hexPts = [];
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * Math.PI * 2;
        hexPts.push([ox + Math.cos(a) * 21, oy + Math.sin(a) * 21]);
      }
      const cellCol = r() > 0.5 ? 'rgba(255, 184, 77, 0.22)' : 'rgba(92, 225, 255, 0.16)';
      DK.poly(g, hexPts, cellCol, 'rgba(255, 213, 120, 0.45)', 1.5);
    }
  }

  // Sweeping British Crimson Annexation Overlay (Top to Bottom)
  if (annexProg > 0) {
    const sweepY = DK.lerp(-330, 340, annexProg);
    g.fillStyle = 'rgba(185, 28, 44, 0.78)';
    g.fillRect(-220, -340, 440, sweepY + 340);
    DK.seg(g, [[-220, sweepY], [220, sweepY]], 5, '#FF4D6A');
    DK.glow(g, 0, sweepY, 90, '#FF4D6A', 0.75);
  }
  g.restore();

  // Outer Map Border & Label
  DK.poly(g, tnPts, null, annexProg > 0.5 ? '#FF4D6A' : '#5CE1FF', 4);
  if (annexProg > 0.35) {
    DK.rr(g, -210, -35, 420, 64, 12);
    g.fillStyle = 'rgba(18, 22, 40, 0.92)';
    g.fill();
    g.strokeStyle = '#FF4D6A';
    g.lineWidth = 2.5;
    g.stroke();
    DK.text(g, 'MADRAS PRESIDENCY (1801 CE)', 0, -3, { size: 23, font: DK.FONTS.ui, weight: 900, color: '#FFD54F' });
  }
  g.restore();
}

function drawBritishCargoShip(g, x, y, s, gt) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);

  const bob = Math.sin(gt * 1.8) * 5;
  g.translate(0, bob);

  // Tall masts & sails
  DK.seg(g, [[-110, -20], [-110, -250]], 7, '#4A3528');
  DK.seg(g, [[45, -20], [45, -270]], 8, '#4A3528');
  DK.poly(g, [[-165, -210], [-55, -210], [-45, -95], [-175, -95]], '#E2E8F0');
  DK.poly(g, [[-20, -230], [110, -230], [120, -100], [-30, -100]], '#CBD5E1');

  // Steam funnel belching dark coal smoke
  DK.rr(g, -42, -135, 34, 115, 4);
  g.fillStyle = '#1E2433';
  g.fill();
  g.fillStyle = '#9E2A2B';
  g.fillRect(-42, -110, 34, 18);
  for (let i = 0; i < 6; i++) {
    const u = ((gt * 0.45 + i * 0.16) % 1);
    const sx = -25 + u * 140;
    const sy = -145 - u * 110 + Math.sin(gt * 3 + i) * 8;
    DK.circle(g, sx, sy, 18 + u * 34, DK.alpha('#1F242E', (1 - u) * 0.55));
  }

  // Wooden/Iron Hull
  DK.poly(g, [[-240, -35], [240, -35], [195, 45], [-195, 45]], '#261C1A', '#C98A2C', 3);
  DK.seg(g, [[-225, -10], [220, -10]], 5, '#D99B26');

  // Stacked Cargo Crates on Deck ("LONDON")
  DK.rr(g, -155, -75, 85, 40, 4);
  g.fillStyle = '#8C5832';
  g.fill();
  DK.text(g, 'LONDON', -112, -55, { size: 15, font: DK.FONTS.mono, color: '#FFF3D6', weight: 700 });
  g.restore();
}

// ============================================================================
// STUDIO PLAYER & HEADLESS RENDER HOOK BOILERPLATE (SFX + AMBIENT ONLY)
// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;
window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;
let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;
function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}
function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}
window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};
function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}
function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}
function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}
function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}
const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});
shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});
document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});
window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
