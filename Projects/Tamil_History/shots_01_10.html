// 1. Conical Clay Iron-Smelting Bloomery Furnace + Stone Anvil + Bellows (2170 BCE Mayiladumparai)
function drawBloomeryFurnace(g, x, y, s = 1, gt = 0, opts = {}) {
  const { showAnvil = true, anvilSide = -1, showBellows = false } = opts;
  g.save();
  g.translate(x, y);
  g.scale(s, s);

  DK.contactShadow(g, 0, 8, 175, 22, 0.45);

  // Stone base ring
  for (let i = -4; i <= 4; i++) {
    const sx = i * 32;
    const sw = 36, sh = 28;
    DK.rr(g, sx - sw / 2, -26, sw, sh, 10);
    g.fillStyle = DK.sphereGrad(g, sx, -12, 22, i % 2 === 0 ? '#4A362E' : '#3B2820');
    g.fill();
  }

  // Conical terracotta/clay furnace body
  DK.poly(
    g,
    [
      [-135, -18],
      [-74, -275],
      [74, -275],
      [135, -18],
    ],
    DK.cylinderGrad(g, -135, -140, 135, -140, '#8C442A', -1)
  );

  // Horizontal clay reinforcement bands
  [-85, -155, -220].forEach((by, idx) => {
    const bw = DK.lerp(122, 82, idx / 2);
    DK.rr(g, -bw, by, bw * 2, 14, 7);
    g.fillStyle = '#6E321C';
    g.fill();
  });

  // Top furnace flue & rising molten glow
  const pulse = 0.82 + 0.18 * Math.sin(gt * 6.5);
  DK.glow(g, 0, -285, 165 * pulse, '#FF5E1A', 0.82);
  DK.ellipse(g, 0, -275, 74, 18, '#2B100A');
  DK.ellipse(g, 0, -275, 56, 12, '#FF9438');

  // Rising flame tongues from top flue
  for (let k = 0; k < 4; k++) {
    const fx = (k - 1.5) * 24 + Math.sin(gt * 8 + k) * 8;
    const fh = 55 + Math.cos(gt * 9 + k * 2) * 22;
    DK.poly(
      g,
      [
        [fx - 16, -275],
        [fx + 16, -275],
        [fx + Math.sin(gt * 11 + k) * 10, -275 - fh],
      ],
      DK.linGrad(g, fx, -275, fx, -275 - fh, ['#FFF3B0', '#FF5E1A', 'rgba(255,60,10,0)'])
    );
  }

  // Arched glowing hearth opening & molten slag tap
  DK.glow(g, 0, -68, 185 * pulse, '#FF5E1A', 0.88);
  g.beginPath();
  g.arc(0, -18, 52, Math.PI, 0, false);
  g.closePath();
  g.fillStyle = DK.radGrad(g, 0, -36, 6, 54, ['#FFF8D6', '#FF9438', '#C92A1A']);
  g.fill();

  // Molten iron trickle into clay mold
  DK.seg(g, [[0, -18], [-12, 8], [-24, 14]], 8, '#FFB84D');
  DK.glow(g, -24, 14, 34, '#FF9438', 0.8);

  // Stone Anvil & Red-Hot Iron Billet
  if (showAnvil) {
    const ax = anvilSide * 135;
    DK.contactShadow(g, ax, 6, 56, 10, 0.4);
    DK.rr(g, ax - 44, -68, 88, 68, 14);
    g.fillStyle = DK.cylinderGrad(g, ax - 44, -68, ax + 44, -68, '#4E5462', -1);
    g.fill();
    // Glowing red-hot iron blade on anvil
    DK.glow(g, ax, -74, 48 * pulse, '#FF5E1A', 0.9);
    DK.rr(g, ax - 32, -76, 64, 10, 5);
    g.fillStyle = '#FFE082';
    g.fill();
  }

  // Dual Leather Bellows & Tuyere Clay Pipe (for Helper on right)
  if (showBellows) {
    const pump = Math.sin(gt * 7.5) * 10;
    DK.seg(g, [[78, -32], [138, -24]], 12, '#A85838'); // Tuyere pipe
    DK.ellipse(g, 155, -26 + pump * 0.4, 38, 22 - pump * 0.3, '#5C3A24');
    DK.ellipse(g, 155, -38 + pump, 36, 12, '#8C5832');
  }

  g.restore();
}

// 2. Megalithic Stone Circle & Dolmen Silhouettes (Krishnagiri / Mayiladumparai Horizon)
function drawMegalithicCircles(g, x, y, s = 1, col = '#240E0B') {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  const stones = [-180, -125, -65, 0, 65, 125, 180];
  stones.forEach((sx, idx) => {
    const sh = 38 + (idx % 3) * 14;
    const sw = 24 + (idx % 2) * 8;
    DK.rr(g, sx - sw / 2, -sh, sw, sh + 6, 8);
    g.fillStyle = col;
    g.fill();
  });
  // Central Capstone Dolmen
  DK.rr(g, -48, -68, 96, 18, 8);
  g.fillStyle = DK.shade(col, 0.08);
  g.fill();
  g.restore();
}

// 3. Stratified Archaeological Trench & Megalithic Burial Urns (Muthumakkal Thazhi)
function drawExcavationTrenchSet(g, x0, x1, yGround = 840, opts = {}) {
  const { showUrns = true, showGrid = true } = opts;
  const w = x1 - x0;

  // Subterranean stratified layers below yGround
  const strata = [
    { h: 55, col: '#5C4028', label: 'TOP SOIL · MODERN' },
    { h: 60, col: '#6E472B', label: 'MEDIEVAL STRATUM (1000 CE)' },
    { h: 65, col: '#854A2A', label: 'SANGAM ERA (600 BCE)' },
    { h: 85, col: '#522618', label: 'IRON AGE BEDROCK (2170 BCE)' },
  ];

  let curY = yGround;
  strata.forEach((st, idx) => {
    g.fillStyle = DK.linGrad(g, x0, curY, x0, curY + st.h, [st.col, DK.shade(st.col, -0.18)]);
    g.fillRect(x0, curY, w, st.h);
    DK.seg(g, [[x0, curY], [x1, curY]], 2.5, 'rgba(255, 220, 165, 0.28)');
    if (opts.showLabels) {
      DK.text(g, st.label, x0 + 36, curY + st.h * 0.5, {
        size: 16,
        font: DK.FONTS.mono,
        weight: 700,
        color: idx === 3 ? '#FFB84D' : 'rgba(255,240,215,0.65)',
        align: 'left',
      });
    }
    curY += st.h;
  });

  // White archaeological quadrant stakes & string grid on surface
  if (showGrid) {
    for (let gx = x0 + 60; gx <= x1 - 60; gx += 180) {
      DK.seg(g, [[gx, yGround + 4], [gx, yGround - 36]], 5, '#D9B372');
      DK.circle(g, gx, yGround - 38, 4, '#FF4D6A');
    }
    DK.seg(g, [[x0 + 60, yGround - 28], [x1 - 60, yGround - 28]], 2, 'rgba(255, 255, 255, 0.72)');
  }

  // Terracotta Megalithic Urns (Muthumakkal Thazhi) partially excavated
  if (showUrns) {
    [x0 + w * 0.28, x0 + w * 0.74].forEach((ux, idx) => {
      const uy = yGround + 52 + idx * 18;
      DK.contactShadow(g, ux, uy + 38, 48, 12, 0.4);
      DK.ellipse(g, ux, uy, 42, 54, DK.sphereGrad(g, ux, uy, 52, '#B85A32'));
      DK.rr(g, ux - 32, uy - 58, 64, 16, 8);
      g.fillStyle = '#9E4724';
      g.fill();
      DK.seg(g, [[ux - 38, uy - 12], [ux + 38, uy - 12]], 3, '#6E2B14');
    });
  }
}

// 4. 3D Shaded Ancient Iron Artifacts (Sword, Sickle/Arival, Socketed Axe/Kodari, Chisel/Uli)
function drawIronArtifactItem(g, x, y, s, kind, gt = 0) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);

  if (kind === 'sword') {
    // Ancient Tanged Iron Broadsword
    DK.seg(g, [[-95, 28], [-45, 8]], 12, '#6E472B');
    DK.circle(g, -98, 30, 11, '#8C5832');
    DK.poly(
      g,
      [
        [-45, 0],
        [-38, 18],
        [105, -36],
        [135, -42],
        [98, -50],
      ],
      DK.linGrad(g, -45, 0, 125, -45, ['#90A4AE', '#CFD8DC', '#607D8B']),
      '#5CE1FF',
      2
    );
  } else if (kind === 'sickle') {
    // Curved Iron Harvesting Sickle (அரிவாள்)
    DK.seg(g, [[-55, 42], [-22, 12]], 13, '#784E34');
    g.strokeStyle = '#B0BEC5';
    g.lineWidth = 14;
    g.lineCap = 'round';
    g.beginPath();
    g.arc(12, -16, 44, Math.PI * 0.75, Math.PI * 1.95, false);
    g.stroke();
    g.strokeStyle = '#5CE1FF';
    g.lineWidth = 2.5;
    g.stroke();
  } else if (kind === 'axe') {
    // Iron Wedge Axe Head (கோடாரி)
    DK.seg(g, [[-45, 48], [35, -48]], 11, '#8C5832');
    DK.poly(
      g,
      [
        [-8, -18],
        [22, -38],
        [62, -4],
        [24, 34],
      ],
      DK.cylinderGrad(g, -8, -28, 58, 28, '#90A4AE', -1),
      '#5CE1FF',
      2
    );
  }

  // Diagnostic X-ray node pulse
  const pulseR = 6 + Math.sin(gt * 5) * 2;
  DK.glow(g, 0, 0, 26, '#5CE1FF', 0.65);
  DK.circle(g, 0, 0, pulseR, '#FFFFFF');
  g.restore();
}

    k.bed('wind', gt0 + 0.0, gt0 + 3.7, { gain: 0.7 });
    k.play('marchSteps', gt0 + 0.10, { n: 7, rate: 0.44, pan: -0.15 });
    k.play('pillBadge', gt0 + 0.25, { f: 'G5' });
    k.play('swordClash', gt0 + 1.85, { pan: 0.35 });
    k.play('coinClink', gt0 + 2.10, { n: 4, pan: 0.25 });
  }

  // Shot 04 (10.8s – 14.2s)
  {
    const gt0 = 10.8 - B;
    k.bed('rain', gt0 + 0.0, gt0 + 1.8, { gain: 0.9 });
    k.play('thunder', gt0 + 0.15, { dur: 1.4, gain: 0.75 });
    k.play('footstep', gt0 + 0.25, { n: 7, rate: 0.42 });
    k.play('pillBadge', gt0 + 1.70, { f: 'A5' });
    k.play('birdSong', gt0 + 2.00, { pan: 0.3 });
  }

  // Shot 05 (14.2s – 18.4s)
  {
    const gt0 = 14.2 - B;
    k.bed('wind', gt0 + 0.0, gt0 + 4.2, { gain: 0.65 });
    k.play('timerChime', gt0 + 0.10, { f: 'A5', gain: 0.9 });
    k.play('counterTick', gt0 + 0.25, { n: 10, rate: 0.06 });
    k.play('footstep', gt0 + 0.40, { n: 8, rate: 0.42, pan: 0.35 });
    k.play('pillBadge', gt0 + 2.10, { f: 'G5', pan: 0.3 });
  }

  // Shot 06 (18.4s – 23.6s)
  {
    const gt0 = 18.4 - B;
    k.bed('volcanoLava', gt0 + 0.0, gt0 + 5.2, { gain: 0.9 });
    k.play('hammerHit', gt0 + 0.20, { n: 6, rate: 0.40, pan: -0.15 });
    k.play('pillBadge', gt0 + 0.40, { f: 'G5' });
    k.play('swordClash', gt0 + 2.60, { pan: -0.15, gain: 0.9 });
  }

  // Shot 07 (23.6s – 29.5s)
  {
    const gt0 = 23.6 - B;
    k.bed('room', gt0 + 0.0, gt0 + 5.9, { gain: 0.7 });
    k.play('footstep', gt0 + 0.20, { n: 6, rate: 0.42, pan: 0.35 });
    k.play('liquidBubble', gt0 + 2.95, { n: 5, pan: 0.25 });
    k.play('pillBadge', gt0 + 2.95, { f: 'C6', pan: 0.25 });
  }

  // Shot 08 (29.5s – 32.2s)
  {
    const gt0 = 29.5 - B;
    k.bed('room', gt0 + 0.0, gt0 + 2.7, { gain: 0.65 });
    k.play('timerChime', gt0 + 0.08, { f: 'A5', gain: 0.9 });
    k.play('counterTick', gt0 + 0.15, { n: 18, rate: 0.08 });
  }

  // Shot 09 (32.2s – 36.2s)
  {
    const gt0 = 32.2 - B;
    k.bed('wind', gt0 + 0.0, gt0 + 4.0, { gain: 0.65 });
    k.play('footstep', gt0 + 0.10, { n: 5, rate: 0.38, pan: -0.15 });
    k.play('pop', gt0 + 2.00, { f: 580 });
  }

  // Shot 10 (36.2s – 39.8s)
  {
    const gt0 = 36.2 - B;
    k.bed('room', gt0 + 0.0, gt0 + 3.6, { gain: 0.7 });
    k.play('blip', gt0 + 0.30, { f: 'E6' });
    k.play('ding', gt0 + 1.80, { f: 'G6', gain: 0.85 });
  }

  // Schedule Two-Phase Matched Boundary Transition SFX
  if (window.DK && DK.scheduleTransitions) {
    DK.scheduleTransitions(k, SHOTS, B, THEME);
  }
}

// ============================================================================
// STUDIO PLAYER & HEADLESS RENDER HOOK BOILERPLATE
// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;
window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();

  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});

window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
