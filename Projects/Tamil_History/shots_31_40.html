function drawRoyalBanner(g, x, y, h, color, emblemType, tilt = 0, t = 0) {
  g.save();
  g.translate(x, y);
  g.rotate(tilt);
  // Pole & Finial
  DK.seg(g, [[0, 0], [0, -h]], 8, '#5C4028');
  DK.circle(g, 0, -h - 8, 10, '#FFD54F');
  // Waving Cloth
  const wave = Math.sin(t * 4.5 + x * 0.01) * 10;
  const bw = 135, bh = 86;
  DK.poly(
    g,
    [
      [4, -h + 8],
      [bw, -h + 14 + wave],
      [bw - 18, -h + 8 + bh * 0.5 + wave * 0.8],
      [bw, -h + 8 + bh + wave],
      [4, -h + 8 + bh],
    ],
    color,
    '#FFD54F',
    3
  );
  // Royal Emblem (Chera Bow, Chola Tiger, Pandya Twin Fish, Pallava Lion)
  const ex = bw * 0.45, ey = -h + 8 + bh * 0.5 + wave * 0.4;
  if (emblemType === 'bow') {
    g.strokeStyle = '#FFD54F';
    g.lineWidth = 4;
    g.beginPath();
    g.arc(ex, ey, 22, -Math.PI * 0.45, Math.PI * 0.45, false);
    g.stroke();
    DK.seg(g, [[ex - 2, ey - 22], [ex - 2, ey + 22]], 2, '#FFF8E7');
    DK.seg(g, [[ex - 16, ey], [ex + 22, ey]], 3, '#FFD54F');
  } else if (emblemType === 'tiger' || emblemType === 'lion') {
    DK.circle(g, ex - 6, ey - 6, 12, '#1A1615');
    DK.ellipse(g, ex + 6, ey + 4, 18, 10, '#1A1615', -0.2);
    DK.seg(g, [[ex + 20, ey + 2], [ex + 32, ey - 12]], 4, '#1A1615');
  } else if (emblemType === 'fish') {
    [-10, 10].forEach((ox) => {
      DK.ellipse(g, ex + ox, ey, 7, 18, '#FFD54F', ox * 0.015);
      DK.poly(g, [[ex + ox, ey + 14], [ex + ox - 7, ey + 24], [ex + ox + 7, ey + 24]], '#FFD54F');
    });
  }
  g.restore();
}

function drawBlankStele(g, x, y, w, h, label, scanActive, gt) {
  g.save();
  g.translate(x, y);
  // Pedestal Base
  DK.contactShadow(g, 0, 8, w * 0.72, 14, 0.45);
  DK.rr(g, -w * 0.62, -36, w * 1.24, 36, 8);
  g.fillStyle = DK.cylinderGrad(g, -w * 0.62, -36, w * 0.62, 0, '#1E293B', -1);
  g.fill();
  g.strokeStyle = '#5CE1FF';
  g.lineWidth = 2;
  g.stroke();

  // Arched Stone Stele Slab (Kalvettu)
  g.beginPath();
  g.moveTo(-w * 0.48, -36);
  g.lineTo(-w * 0.48, -h + w * 0.48);
  g.arc(0, -h + w * 0.48, w * 0.48, Math.PI, 0, false);
  g.lineTo(w * 0.48, -36);
  g.closePath();
  g.fillStyle = DK.linGrad(g, -w * 0.48, -h, w * 0.48, -36, ['#2D3748', '#1A202C', '#111827']);
  g.fill();
  g.strokeStyle = scanActive ? '#5CE1FF' : 'rgba(92, 225, 255, 0.45)';
  g.lineWidth = 3;
  g.stroke();

  // Dashed Blank Epigraphic Lines & Question Mark
  g.save();
  g.setLineDash([10, 8]);
  for (let row = 0; row < 5; row++) {
    const ly = -h * 0.68 + row * 34;
    DK.seg(g, [[-w * 0.32, ly], [w * 0.32, ly]], 2.5, 'rgba(148, 163, 184, 0.35)');
  }
  g.restore();

  const pulse = 0.55 + 0.45 * Math.sin(gt * 4 + x * 0.01);
  DK.text(g, '?', 0, -h * 0.52, {
    size: 86,
    font: DK.FONTS.serif,
    weight: 900,
    color: DK.alpha('#5CE1FF', pulse),
    glow: 18,
    glowColor: '#5CE1FF',
  });

  DK.text(g, label, 0, -64, {
    size: 18,
    font: DK.FONTS.mono,
    weight: 700,
    color: '#94A3B8',
  });
  g.restore();
}

function drawMonolithicBoulders(g, shimmerProg, gt) {
  g.save();
  // Pancha Ratha & Mamallapuram Granite Outcrops
  const boulders = [
    { x: 1260, y: 840, w: 220, h: 310, col: '#B89B72', ratha: true },
    { x: 1490, y: 840, w: 260, h: 410, col: '#A88B62', ratha: true },
    { x: 1690, y: 840, w: 210, h: 260, col: '#967A54', ratha: false },
  ];
  boulders.forEach((b, idx) => {
    DK.contactShadow(g, b.x, b.y + 4, b.w * 0.6, 14, 0.32);
    // Base Monolithic Rock
    DK.rr(g, b.x - b.w * 0.5, b.y - b.h * 0.68, b.w, b.h * 0.68, 28);
    g.fillStyle = DK.cylinderGrad(g, b.x - b.w * 0.5, b.y - b.h, b.x + b.w * 0.5, b.y, b.col, -1);
    g.fill();

    if (b.ratha) {
      // Stepped Pyramidal Monolithic Vimana Tiers
      for (let tIdx = 1; tIdx <= 3; tIdx++) {
        const tw = b.w * (1 - tIdx * 0.18);
        const th = b.h * 0.11;
        const ty = b.y - b.h * 0.68 - tIdx * th;
        DK.rr(g, b.x - tw * 0.5, ty, tw, th + 4, 8);
        g.fillStyle = DK.shade(b.col, tIdx * 0.06);
        g.fill();
      }
      // Octagonal Stupi Dome & Finial
      const topY = b.y - b.h * 1.02;
      DK.circle(g, b.x, topY, b.w * 0.18, DK.sphereGrad(g, b.x, topY, b.w * 0.18, DK.shade(b.col, 0.15)));
      DK.circle(g, b.x, topY - b.w * 0.20, 7, '#FFD54F');
      // Carved Pillared Niche
      DK.rr(g, b.x - b.w * 0.26, b.y - b.h * 0.45, b.w * 0.52, b.h * 0.45, 6);
      g.fillStyle = DK.shade(b.col, -0.28);
      g.fill();
    }

    // Golden Shimmer Aura when lt >= 2.05s
    if (shimmerProg > 0) {
      DK.glow(g, b.x, b.y - b.h * 0.55, b.w * 0.85, '#FFD54F', shimmerProg * 0.42);
      g.strokeStyle = DK.alpha('#FFE082', shimmerProg * (0.6 + 0.4 * Math.sin(gt * 6 + idx)));
      g.lineWidth = 3.5;
      DK.rr(g, b.x - b.w * 0.5, b.y - b.h * 0.68, b.w, b.h * 0.68, 28);
      g.stroke();
    }
  });
  g.restore();
}

    k.bed('wind', gt0 + 0.0, gt0 + 4.1, { gain: 0.75 });
    k.play('swordClash', gt0 + 0.45, { pan: -0.25, gain: 0.9 });
    k.play('swordClash', gt0 + 1.65, { pan: 0.25, gain: 0.95 });
    k.play('footstep', gt0 + 1.80, { n: 8, rate: 0.22, pan: 0.4 });
  }

  // Shot 37 (136.7s – 141.1s)
  {
    const gt0 = 136.7 - b0;
    k.bed('wind', gt0 + 0.0, gt0 + 4.4, { gain: 0.65 });
    k.play('templeBell', gt0 + 0.25, { f: 'C5', gain: 0.85 });
    k.play('footstep', gt0 + 0.30, { n: 9, rate: 0.42 });
    k.play('birdSong', gt0 + 2.20, { pan: 0.25 });
  }

  // Shot 38 (141.1s – 144.0s)
  {
    const gt0 = 141.1 - b0;
    k.bed('room', gt0 + 0.0, gt0 + 2.9, { gain: 0.65 });
    k.play('pillBadge', gt0 + 0.20, { f: 'G5' });
    k.play('footstep', gt0 + 0.25, { n: 6, rate: 0.40 });
  }

  // Shot 39 (144.0s – 148.1s)
  {
    const gt0 = 144.0 - b0;
    k.bed('ocean', gt0 + 0.0, gt0 + 4.1, { gain: 0.8 });
    k.play('footstep', gt0 + 0.20, { n: 8, rate: 0.42 });
    k.play('starShimmer', gt0 + 2.05, { gain: 0.85 });
  }

  // Shot 40 (148.1s – 153.3s)
  {
    const gt0 = 148.1 - b0;
    k.bed('room', gt0 + 0.0, gt0 + 5.2, { gain: 0.65 });
    k.play('thud', gt0 + 0.60, { f: 140, gain: 0.6 });
    k.play('thud', gt0 + 1.40, { f: 155, gain: 0.6 });
    k.play('thud', gt0 + 2.20, { f: 170, gain: 0.6 });
    k.play('thud', gt0 + 3.00, { f: 185, gain: 0.6 });
    k.play('hammerHit', gt0 + 0.40, { n: 6, rate: 0.65, pan: -0.25 });
  }

  // Schedule Matched Boundary Transition SFX
  if (window.DK && DK.scheduleTransitions) {
    DK.scheduleTransitions(k, SHOTS, b0, THEME);
  }
}

// ============================================================================
// STUDIO PLAYER & DETERMINISTIC HEADLESS RENDER HOOKS
// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;
window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();

  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});
shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});

window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
