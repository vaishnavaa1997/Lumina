function drawDharmarajaRatha(g, cx, baseY, s = 1.0) {
  g.save();
  g.translate(cx, baseY);
  g.scale(s, s);

  const stoneBase = '#B89F82';
  const stoneLight = '#D6C2A8';
  const stoneDark = '#7E6850';

  // Plinth / Adhishthana base
  DK.rr(g, -250, -56, 500, 56, 8);
  g.fillStyle = DK.cylinderGrad(g, -250, -56, 250, 0, stoneDark, -1);
  g.fill();

  // Tier 1: Ground Pillared Mandapam with Lion Base Pillars
  DK.rr(g, -220, -210, 440, 154, 6);
  g.fillStyle = DK.cylinderGrad(g, -220, -210, 220, -56, stoneBase, -1);
  g.fill();

  // Carved Niches & Pillars
  for (let i = -3; i <= 3; i++) {
    const px = i * 58;
    DK.rr(g, px - 12, -196, 24, 140, 4);
    g.fillStyle = stoneLight;
    g.fill();
    // Simha (Lion) base motif
    DK.circle(g, px, -72, 11, stoneDark);
  }

  // Cornice / Kapota with Kudu horseshoe arches
  DK.rr(g, -236, -242, 472, 34, 8);
  g.fillStyle = stoneDark;
  g.fill();
  for (let i = -3; i <= 3; i++) {
    const kx = i * 62;
    DK.circle(g, kx, -225, 11, stoneLight);
    DK.circle(g, kx, -225, 5, '#4A3828');
  }

  // Tier 2: Stepped Vimana Storey
  DK.rr(g, -172, -356, 344, 114, 6);
  g.fillStyle = DK.cylinderGrad(g, -172, -356, 172, -242, stoneBase, -1);
  g.fill();
  for (let i = -2; i <= 2; i++) {
    const nx = i * 64;
    DK.rr(g, nx - 18, -340, 36, 84, 6);
    g.fillStyle = stoneDark;
    g.fill();
    DK.rr(g, nx - 12, -332, 24, 70, 4);
    g.fillStyle = stoneLight;
    g.fill();
  }

  // Tier 2 Cornice
  DK.rr(g, -186, -384, 372, 28, 6);
  g.fillStyle = stoneDark;
  g.fill();
  for (let i = -2; i <= 2; i++) {
    DK.circle(g, i * 64, -370, 9, stoneLight);
  }

  // Tier 3: Upper Vimana Storey
  DK.rr(g, -118, -468, 236, 84, 6);
  g.fillStyle = DK.cylinderGrad(g, -118, -468, 118, -384, stoneBase, -1);
  g.fill();
  for (let i = -1; i <= 1; i++) {
    DK.rr(g, i * 56 - 14, -454, 28, 60, 4);
    g.fillStyle = stoneDark;
    g.fill();
  }

  // Octagonal Shikhara Dome (Griva + Shikhara)
  DK.poly(
    g,
    [
      [-92, -468],
      [92, -468],
      [112, -505],
      [64, -556],
      [-64, -556],
      [-112, -505],
    ],
    DK.sphereGrad(g, 0, -512, 110, stoneLight)
  );

  // Golden Stupi / Kalasam Finial at Apex
  DK.glow(g, 0, -578, 42, '#FFD54F', 0.65);
  DK.circle(g, 0, -570, 14, '#FFD54F');
  DK.poly(g, [[-6, -580], [6, -580], [0, -604]], '#FFE082');

  g.restore();
}

function drawRawGraniteBoulder(g, cx, baseY, s = 1.0) {
  g.save();
  g.translate(cx, baseY);
  g.scale(s, s);

  // Massive organic uncarved mountain boulder silhouette
  const pts = [
    [-290, 0],
    [-310, -140],
    [-275, -310],
    [-225, -455],
    [-130, -565],
    [-20, -610],
    [110, -585],
    [215, -475],
    [275, -330],
    [305, -160],
    [285, 0],
  ];
  DK.poly(
    g,
    pts,
    DK.linGrad(g, -260, -590, 260, 0, ['#9E8C7A', '#7A6855', '#4E3F30']),
    '#3B2E22',
    3
  );

  // Natural granite strata & quarry chisel guideline striations
  DK.seg(g, [[-230, -420], [-40, -390], [190, -430]], 3, 'rgba(45,32,22,0.45)');
  DK.seg(g, [[-265, -260], [20, -235], [245, -270]], 3, 'rgba(45,32,22,0.45)');
  DK.seg(g, [[-280, -110], [-30, -95], [260, -120]], 3, 'rgba(45,32,22,0.45)');

  g.restore();
}

function drawTopToBottomMonolithCutaway(g, lt, gt) {
  const cx = 1020;
  const baseY = 840;
  const scanY = DK.key(lt, [[0.4, 240], [5.4, 825]], DK.ease.inOutCubic);

  // 1. Below scanY: Raw Uncarved Mountain Granite Boulder
  g.save();
  g.beginPath();
  g.rect(0, scanY, 1920, 1080 - scanY);
  g.clip();
  drawRawGraniteBoulder(g, cx, baseY, 1.0);
  g.restore();

  // 2. Above scanY: Carved Dharmaraja Ratha Emerging Top-to-Bottom!
  g.save();
  g.beginPath();

  DK.seg(g, [[cx - 340, scanY], [cx + 340, scanY]], 5, '#FFF3D1');
  DK.seg(g, [[cx - 360, scanY], [cx + 360, scanY]], 14, 'rgba(255, 184, 77, 0.35)');

  [-390, 390].forEach((ox) => {
    const ax = cx + ox;
    DK.seg(g, [[ax, 270], [ax, scanY]], 4, '#FFD54F');
    DK.poly(g, [[ax - 12, scanY - 14], [ax + 12, scanY - 14], [ax, scanY + 6]], '#FFD54F');
    DK.text(g, 'TOP → DOWN', ax, 242, { size: 18, weight: 800, color: '#FFD54F' });
  });

  // Flying granite chips at scan line
  const r = DK.rng(41);
  for (let i = 0; i < 16; i++) {
    const ph = (gt * 3.2 + i * 0.19) % 1;
    const chipX = cx + (r() - 0.5) * 520;
    const chipY = scanY + ph * 65;
    DK.circle(g, chipX, chipY, (1 - ph) * 6, '#FFE094');

}

    k.play('footstep', gt0 + 0.30, { n: 5, rate: 0.42, pan: 0.25 });
  }

  // --- SHOT 43 (161.9s – 164.4s) ---
  {
    const gt0 = 161.9 - B0;
    k.bed('wind', gt0 + 0.0, gt0 + 2.5, { gain: 0.65 });
    k.play('hammerHit', gt0 + 0.15, { n: 5, rate: 0.42, gain: 0.95 });
  }

  // --- SHOT 44 (164.4s – 167.5s) ---
  {
    const gt0 = 164.4 - B0;
    k.bed('room', gt0 + 0.0, gt0 + 3.1, { gain: 0.65 });
    k.play('boltSnap', gt0 + 0.35, { gain: 0.85 });
    k.play('shatter', gt0 + 0.55, { gain: 0.75 });

  // --- SHOT 45 (167.5s – 169.6s) ---
  {
    const gt0 = 167.5 - B0;
    k.bed('ocean', gt0 + 0.0, gt0 + 2.1, { gain: 0.75 });
    k.play('ding', gt0 + 0.15, { f: 'E6', gain: 0.85 });
    k.play('footstep', gt0 + 0.20, { n: 4, rate: 0.42 });

  // --- SHOT 46 (169.6s – 173.0s) ---
  {
    const gt0 = 169.6 - B0;
    k.bed('ocean', gt0 + 0.0, gt0 + 3.4, { gain: 0.7 });
    k.play('footstep', gt0 + 0.20, { n: 6, rate: 0.42 });
    k.play('coinClink', gt0 + 1.70, { n: 4, pan: 0.0 });
  }

  // --- SHOT 47 (173.0s – 177.1s) ---
  {
    const gt0 = 173.0 - B0;
    k.bed('wind', gt0 + 0.0, gt0 + 4.1, { gain: 0.7 });
    k.play('templeBell', gt0 + 0.25, { f: 'D5', gain: 0.85 });
    k.play('footstep', gt0 + 0.30, { n: 8, rate: 0.45 });
  }

  // --- SHOT 48 (177.1s – 180.5s) ---
  {
    const gt0 = 177.1 - B0;
    k.bed('wind', gt0 + 0.0, gt0 + 3.4, { gain: 0.65 });
    k.play('swish', gt0 + 0.20, { dur: 0.16, pan: -0.2 });
    k.play('swish', gt0 + 0.55, { dur: 0.16, pan: 0.2 });
    k.play('thud', gt0 + 0.90, { f: 160, gain: 0.75 });
    k.play('toasterPop', gt0 + 1.70, { gain: 0.9 });

  // --- SHOT 49 (180.5s – 183.2s) ---
  {
    const gt0 = 180.5 - B0;
    k.bed('wind', gt0 + 0.0, gt0 + 2.7, { gain: 0.6 });
    k.play('pop', gt0 + 0.25, { f: 520, gain: 0.85 });

  // --- SHOT 50 (183.2s – 186.1s) ---

  }

  if (window.DK && DK.scheduleTransitions) {
    DK.scheduleTransitions(k, SHOTS, B0, THEME);
  }
}

// ============================================================================
// STUDIO PLAYER & HEADLESS RENDER HOOK
// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;
window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});

window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
