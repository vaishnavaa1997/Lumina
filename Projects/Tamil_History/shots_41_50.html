  spawnChar(g, id, overrides = {}) {
    const base = this.CHARS[id] || this.CHARS.HOST_PROTAG;
    const cfg = Object.assign({}, base, overrides, {
      beard: false,
      mustache: false

    if (base.pose || overrides.pose) {
      cfg.pose = Object.assign({}, base.pose || {}, overrides.pose || {});
    }
    DK.char(g, cfg);
  },

  spawnAnimal(g, id, overrides = {}) {

    DK.animal(g, cfg);

  drawEnv(envId, g, cam, gt, heroFn) {
    if (envId === 'ENV_MAMALLAPURAM_SHORE') {
      DK.fivePlane(g, cam, {
        bgSky: (g) => {
          DK.mood(g, 'coastalDay');
          FX.sun(g, 1520, 200, 68);
          FX.godRays(g, 1520, 200, { count: 7, a: 0.14 });
          FX.clouds(g, { seed: 41, count: 7, y: 150, h: 140, color: '#FFFFFF', a: 0.88, t: gt, speed: 12 });
        },
        bgFarDepth: 0.35,
        bgFarBlur: 2,
        bgFar: (g) => {
          FX.storybookHorizon(g, { style: 'harbor', y: 740, seed: 42 });
          FX.waterBody(g, gt, { x: 0, y: 725, w: 1920, h: 120, color: '#1D70B8', waves: true });

          FX.tree(g, 1690, 795, 1.1, '#3E8E41', 'palm');
        },
        mgHero: (g) => {
          FX.storybookGround(g, 840, { style: 'sand', baseCol: '#D4B895', grassCol: '#689F58' });
          // Sculpted stone terrace path
          g.save();
          g.fillStyle = '#B89F84';
          g.fillRect(140, 836, 1640, 18);
          g.strokeStyle = 'rgba(70, 52, 36, 0.35)';

          for (let sx = 180; sx < 1760; sx += 110) {
            g.beginPath();
            g.moveTo(sx, 836);
            g.lineTo(sx - 18, 854);
            g.stroke();
          }
          g.restore();
          if (typeof heroFn === 'function') heroFn(g);
        },
        fgBokehDepth: 1.45,
        fgBokehBlur: 8,
        fgBokeh: (g) => {
          FX.bokehOrbs(g, gt, { count: 10, color: 'rgba(255, 232, 175, 0.22)' });
        }
      });
      return;
    }

          FX.sun(g, 1460, 190, 62);
          FX.clouds(g, { seed: 43, count: 6, y: 145, h: 135, color: '#FFFFFF', a: 0.88, t: gt, speed: 10 });

        const p = DK.pop(lt, 1.45, 0.35);

        g.globalAlpha = DK.clamp(p, 0, 1);
        g.strokeStyle = '#5CE1FF';

        g.stroke();

        const pulse = 0.7 + 0.3 * Math.sin(gt * 6);
        g.save();
        g.strokeStyle = `rgba(255, 133, 27, ${pulse})`;
        g.fillStyle = `rgba(255, 133, 27, ${pulse})`;
        g.lineWidth = 5;
        const ax = 895;
        g.beginPath();
        g.moveTo(ax, 330);
        g.lineTo(ax, 700);
        g.stroke();
        for (let ay = 420; ay <= 700; ay += 140) {
          g.beginPath();
          g.moveTo(ax - 14, ay - 18);
          g.lineTo(ax, ay);
          g.lineTo(ax + 14, ay - 18);
          g.closePath();
          g.fill();
        }
        g.restore();
      }
      return;

    if (infoId === 'PHY_OOPS_MONOLITH') {

        id: 'pallava_oops_monolith_49',

        y: 840,

        seed: 49

      // Comedic "OOPS! NO CTRL+Z" visual stamp at lt >= 1.15s

        g.rotate(-0.12);

  {

    env_id: 'ENV_MAMALLAPURAM_SHORE + PHY_OOPS_MONOLITH',

      UI.pillBadge(g, lt, {

        accent: '#FF4D6A',

      UI.citation(g, 'Unfinished Pancha Rathas & Pidari Rathas Monoliths, Mamallapuram', { align: 'right' });
      DK.finishFrame(g, gt, { vignette: 0.28, grain: 0.025 });
    },
    sfx(k, bt0) {
      k.bed('ancientHarbor', bt0 + 0.0, bt0 + 1.10, { gain: 0.20 });
      k.play('stoneCollapse', bt0 + 1.10, { gain: 0.75 });
      k.play('shatter', bt0 + 1.12, { gain: 0.68 });
      k.play('comicBoing', bt0 + 1.35, { gain: 0.45 });

  },

  // --------------------------------------------------------------------------
  // SHOT 050 · [02:47.0 - 02:49.6] (167.0s – 169.6s · dur: 2.6s)
  // --------------------------------------------------------------------------
  {
    shot_number: 50,
    title: 'Millimeter-Perfect Monolithic Precision (Arjuna’s Penance)',
    start: 167.0,
    end: 169.6,
    duration: 2.6,
    vo_line: 'அந்த அளவுக்கு ஒரு துல்லியத்தோட வேலை செஞ்சிருக்காங்க.',
    env_id: 'ENV_MAMALLAPURAM_SHORE',
    chars: 'PALLAVA_SCULPTOR (x: 680) + ROYAL_ELEPHANT (moveX: 980 -> 1120)',
    on_screen_text: 'MILLIMETER-PERFECT MONOLITHIC PRECISION',
    camera_sfx: 'Push-in 1.02->1.08 · chiselHit + chimeSuccess',
    transition_id: 'CAMERA_PAN_TO_SEA_MAP',
    draw(g, lt, gt, u) {
      const cam = {
        x: DK.key(lt, [[0, 930], [2.6, 960]], DK.ease.outCubic),
        y: DK.key(lt, [[0, 540], [2.6, 530]], DK.ease.outCubic),
        z: DK.key(lt, [[0, 1.02], [2.6, 1.08]], DK.ease.outCubic)

      THEME.drawEnv('ENV_MAMALLAPURAM_SHORE', g, cam, gt, (g) => {
        // Arjuna's Penance / Descent of the Ganges Great Bas-Relief Wall at x: 750..1220
        g.save();
        g.fillStyle = '#C5AC90';
        g.strokeStyle = '#6E5A44';
        g.lineWidth = 4;
        g.beginPath();
        g.roundRect(750, 470, 480, 370, 28);
        g.fill();
        g.stroke();
        // Central cleft fissure & carved relief panels
        g.strokeStyle = '#524130';
        g.lineWidth = 5;
        g.beginPath();
        g.moveTo(965, 475);
        g.lineTo(955, 838);
        g.stroke();
        g.restore();

        // Target bas-relief prop at x: 765 (charX + 85px exact contact from Master Sculptor at 680)
        FX.interactiveProp(g, { kind: 'brickWallBuild', x: 765, y: 840, cutTime: 1.30, lt, gt });

        // Master Sculptor polishing the finished granite bas-relief
        THEME.spawnChar(g, 'PALLAVA_SCULPTOR', {
          x: 680,

        });

        // Sculpted Royal Elephant walking forward in front of the relief (moveX: 980 -> 1120)
        THEME.spawnAnimal(g, 'ROYAL_ELEPHANT', {
          moveX: [980, 1120, lt, 2.6],

        });

        // Mid-Shot Micro-Beat (lt >= 1.30s): Golden precision caliper gridlines lock over the relief
        if (lt >= 1.30) {
          const calA = DK.clamp((lt - 1.30) / 0.35, 0, 1);
          g.save();
          g.globalAlpha = calA;
          g.strokeStyle = '#FFD54F';
          g.lineWidth = 2;
          g.setLineDash([6, 6]);
          for (let gx = 780; gx <= 1200; gx += 70) {
            g.beginPath();
            g.moveTo(gx, 485);
            g.lineTo(gx, 825);
            g.stroke();
          }
          for (let gy = 520; gy <= 800; gy += 70) {
            g.beginPath();
            g.moveTo(765, gy);
            g.lineTo(1215, gy);
            g.stroke();
          }
          g.setLineDash([]);
          g.fillStyle = 'rgba(15, 23, 42, 0.9)';
          g.strokeStyle = '#38C878';
          g.lineWidth = 2.5;
          g.beginPath();
          g.roundRect(830, 425, 320, 42, 8);
          g.fill();

      UI.citation(g, 'Arjuna’s Penance / Descent of the Ganges Bas-Relief (29m × 13m)', { align: 'left' });

    },
    sfx(k, bt0) {
      k.bed('ancientHarbor', bt0 + 0.0, bt0 + 2.6, { gain: 0.22 });
      k.play('anvilStrike', bt0 + 0.25, { gain: 0.48 });
      k.play('timerChime', bt0 + 1.30, { gain: 0.55 });
      k.play('elephantTrumpet', bt0 + 1.55, { gain: 0.36 });
    }
  }
];

if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;

// Auto-runs each shot's attached sfx(k, bt0) if scoreSound(k) is not defined separately
if (typeof window.scoreSound !== 'function') {
  window.scoreSound = function scoreSound(k) {
    SHOTS.forEach((s) => {
      if (typeof s.sfx === 'function') s.sfx(k, s.start - BATCH_START);
    });
  };
}
const scoreSound = window.scoreSound;

window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0, playing = false, rafId = null, lastTs = 0, stopSound = null, activeShotFilter = 'all', voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) DK.drawShot(ctx, s, lt, gt, u);
  else s.draw(ctx, lt, gt, u);
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent = gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  if (voAudio) { voAudio.currentTime = BATCH_START + currentT; voAudio.play().catch(() => {}); }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START, sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});
window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  if (window.MAP && MAP.preloadAll) await MAP.preloadAll(SHOTS);
  renderAtLocal(0);
});
</script>
