// 1. 3D Illuminated Museum Pedestal & Iron Age Tool Showcase (Shot 11)
function drawArtifactPedestal(g, x, y, lt, t0, kind, gt) {
  const popS = DK.pop(lt, t0, 0.42);
  if (popS <= 0.001) return;

  // Overhead volumetric spotlight cone
  FX.lightCone(g, x, 80, {
    angle: Math.PI * 0.5,
    spread: 0.42,
    len: 680,
    color: '#FFE094',
    a: 0.24 * popS,
  });

  g.save();
  g.translate(x, y);
  g.scale(popS, popS);

  // Pedestal base
  DK.contactShadow(g, 0, 175, 130, 18, 0.45);
  DK.rr(g, -110, 85, 220, 90, 14);
  g.fillStyle = DK.cylinderGrad(g, -110, 85, 110, 85, '#3E2B1D', -1);
  g.fill();
  g.strokeStyle = '#FFB84D';
  g.lineWidth = 2.5;
  g.stroke();

  DK.ellipse(g, 0, 85, 110, 18, '#5C4028');
  DK.glow(g, 0, -25, 135, '#FFB84D', 0.35);

  // Floating bob & subtle rotation for the 3D Iron Tool
  const bobY = Math.sin(gt * 3.2 + x * 0.01) * 10 - 30;
  g.save();
  g.translate(0, bobY);
  g.rotate(Math.sin(gt * 1.8 + x) * 0.08);

  if (kind === 'sickle') {
    // Curved Iron Harvesting Sickle (அரிவாள்)
    DK.rr(g, -22, 24, 28, 78, 12);
    g.fillStyle = DK.cylinderGrad(g, -22, 24, 6, 24, '#8C5832', -1);
    g.fill();
    DK.rr(g, -26, 18, 36, 14, 6);
    g.fillStyle = '#D99B26';
    g.fill();
    g.strokeStyle = '#CFD8DC';
    g.lineWidth = 24;
    g.lineCap = 'round';
    g.beginPath();
    g.arc(28, -22, 68, Math.PI * 0.72, Math.PI * 1.92, false);
    g.stroke();
    g.strokeStyle = '#FFFFFF';
    g.lineWidth = 4;
    g.beginPath();
    g.arc(28, -22, 76, Math.PI * 0.78, Math.PI * 1.85, false);
    g.stroke();
  } else if (kind === 'axe') {
    // Iron Socketed Axe (கோடாரி)
    DK.rr(g, -12, -95, 24, 195, 10);
    g.fillStyle = DK.cylinderGrad(g, -12, -95, 12, -95, '#784E34', -1);
    g.fill();
    DK.poly(
      g,
      [
        [-16, -65],
        [78, -96],
        [92, -18],
        [-16, -25],
      ],
      DK.linGrad(g, -16, -60, 92, -60, ['#78909C', '#CFD8DC', '#FFFFFF']),
      '#FFB84D',
      2.5
    );
  } else if (kind === 'chisel') {
    // Heavy Forged Iron Stone/Wood Chisel (உளி)
    DK.rr(g, -20, -105, 40, 62, 10);
    g.fillStyle = DK.cylinderGrad(g, -20, -105, 20, -105, '#8C5832', -1);
    g.fill();
    DK.poly(
      g,
      [
        [-16, -45],
        [16, -45],
        [26, 78],
        [-26, 78],
      ],
      DK.cylinderGrad(g, -24, 0, 24, 0, '#B0BEC5', -1),
      '#FFB84D',
      2.5
    );
    DK.poly(g, [[-26, 78], [26, 78], [18, 96], [-18, 96]], '#FFFFFF');
  }

  g.restore();
  g.restore();
}

// 2. Prehistoric / Sangam Thatched Village Hut Silhouette
function drawThatchedHut(g, x, y, s = 1, alphaVal = 1) {
  if (alphaVal <= 0.01) return;
  g.save();
  g.globalAlpha *= alphaVal;
  g.translate(x, y);
  g.scale(s, s);
  DK.contactShadow(g, 0, 4, 95, 12, 0.32);
  // Mud wall cylinder
  DK.rr(g, -68, -95, 136, 95, 10);
  g.fillStyle = DK.cylinderGrad(g, -68, -95, 68, -95, '#8C623E', -1);
  g.fill();
  // Doorway
  DK.rr(g, -20, -68, 40, 68, 16);
  g.fillStyle = '#2B1B12';
  g.fill();
  // Conical thatched roof
  DK.poly(g, [[-92, -88], [92, -88], [0, -178]], DK.linGrad(g, 0, -178, 0, -88, ['#D9A85B', '#9E7032']));
  g.restore();
}

// 3. Traditional Tamil Brass Standing Oil Lamp (Kuththu Vilakku)
function drawKuththuVilakku(g, x, y, s = 1, gt = 0) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);
  DK.contactShadow(g, 0, 4, 42, 8, 0.35);
  // Base & stem
  DK.ellipse(g, 0, 0, 38, 10, '#D99B26');
  DK.rr(g, -8, -145, 16, 145, 6);
  g.fillStyle = DK.cylinderGrad(g, -8, -145, 8, -145, '#FFD54F', -1);
  g.fill();
  // Oil bowl & swan finial
  DK.ellipse(g, 0, -145, 34, 10, '#F5B942');
  DK.circle(g, 0, -175, 10, '#FFD54F');
  // Five flickering wicks
  const flicker = 0.85 + 0.15 * Math.sin(gt * 14);
  DK.glow(g, 0, -155, 95 * flicker, '#FFAE38', 0.85);
  [-26, -13, 0, 13, 26].forEach((wx) => {
    DK.poly(g, [[wx - 5, -148], [wx + 5, -148], [wx, -168 * flicker]], '#FFF6D6');
  });
  g.restore();
}

// 4. Keeladi Baked-Brick Wall कोर्स (Courses) & Terracotta Pipeline Helper
function drawKeeladiBrickWall(g, x, y, w, h, brickCol = '#A84832') {
  g.save();
  DK.rr(g, x, y, w, h, 8);
  g.fillStyle = DK.linGrad(g, x, y, x, y + h, [brickCol, DK.shade(brickCol, -0.22)]);
  g.fill();
  g.clip();

  const rowH = 22;
  const colW = 54;
  g.strokeStyle = 'rgba(45, 18, 12, 0.45)';
  g.lineWidth = 2;
  for (let ry = y; ry <= y + h; ry += rowH) {
    g.beginPath();
    g.moveTo(x, ry);
    g.lineTo(x + w, ry);
    g.stroke();
    const rowIdx = Math.round((ry - y) / rowH);
    const offset = (rowIdx % 2) * (colW * 0.5);
    for (let cx = x - offset; cx <= x + w; cx += colW) {
      g.beginPath();
      g.moveTo(cx, ry);
      g.lineTo(cx, ry + rowH);
      g.stroke();
    }
  }
  g.restore();
}

  // Shot 17 (62.3s – 65.7s)
  {
    const gt0 = 62.3 - B;
    k.bed('wind', gt0 + 0.0, gt0 + 3.4, { gain: 0.65 });
    k.play('hammerHit', gt0 + 0.20, { n: 4, rate: 0.45, pan: -0.25 });
    k.play('starShimmer', gt0 + 1.70, { gain: 0.75 });
  }

  // Shot 18 (65.7s – 68.3s)
  {
    const gt0 = 65.7 - B;
    k.bed('room', gt0 + 0.0, gt0 + 2.6, { gain: 0.65 });
    k.play('thud', gt0 + 0.60, { f: 160, pan: -0.3, gain: 0.65 });
    k.play('thud', gt0 + 1.20, { f: 150, pan: 0.3, gain: 0.65 });
    k.play('footstep', gt0 + 0.20, { n: 5, rate: 0.40 });
  }

  // Shot 19 (68.3s – 73.3s)
  {
    const gt0 = 68.3 - B;
    k.bed('wind', gt0 + 0.0, gt0 + 5.0, { gain: 0.65 });
    k.play('pillBadge', gt0 + 0.40, { f: 'E5', pan: -0.4 });
    k.play('pillBadge', gt0 + 1.60, { f: 'G5', pan: 0.0 });
    k.play('pillBadge', gt0 + 2.50, { f: 'B5', pan: 0.4 });
    k.play('footstep', gt0 + 0.30, { n: 8, rate: 0.42, pan: 0.25 });
  }

  // Shot 20 (73.3s – 77.5s)
  {
    const gt0 = 73.3 - B;
    k.bed('fountainWater', gt0 + 0.0, gt0 + 4.2, { gain: 0.85 });
    k.play('pillBadge', gt0 + 0.30, { f: 'A5' });
    k.play('liquidBubble', gt0 + 2.10, { n: 6, pan: 0.15 });
  }

  // Schedule Two-Phase Matched Boundary Transition SFX
  if (window.DK && DK.scheduleTransitions) {
    DK.scheduleTransitions(k, SHOTS, B, THEME);
  }
}

// ============================================================================
// STUDIO PLAYER & HEADLESS RENDER HOOK BOILERPLATE
// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;
window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();

  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});

window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
