BGM_SCORE.cues.forEach((c, idx) => {
  const div = document.createElement('div');
  div.className = 'cue-card';
  div.id = 'cue-card-' + idx;
  const sit = c.situation || c.archetype || 'SCIENTIFIC_INQUIRY';
  const cult = c.culture || 'modernCinematic';
  const tens = c.tension !== undefined ? Math.round(c.tension * 100) + '%' : '50%';
  const val = c.valence !== undefined ? (c.valence >= 0 ? '+' + c.valence : c.valence) : '0.0';
  const tempoLabel = Array.isArray(c.tempoCurve)
    ? c.tempoCurve[0][1] + '→' + c.tempoCurve[c.tempoCurve.length - 1][1]
    : (c.bpm || 108);
  const activeStems = c.layerStems
    ? Object.keys(c.layerStems).filter((k) => c.layerStems[k]).join(', ')
    : 'all';

  div.innerHTML =
    '<div>' +
    '<div class="cue-title">' + c.cue_id + ' (' + (c.shots || '') + ') · ' + sit + ' [' + cult + '] — ' + (c.desc || '') + '</div>' +
    '<div class="cue-sub">Tension: ' + tens + ' · Valence: ' + val + ' · Key: ' + (c.key || 'D Minor') + ' · BPM: ' + tempoLabel + ' · Stems: [' + activeStems + '] · Timer Chime: ' + (c.timerChime ? 'Yes' : 'No') + '</div>' +
    '</div>' +
    '<div class="badge">' + c.start_time.toFixed(1) + 's – ' + c.end_time.toFixed(1) + 's</div>';

  div.addEventListener('click', () => {
    updateUI(c.start_time);
    if (playing) startAudio();
  });

  cueListEl.appendChild(div);
});

function findCueAt(t){
  for (let i = 0; i < BGM_SCORE.cues.length; i++) {
    const c = BGM_SCORE.cues[i];
    if (t >= c.start_time && t <= c.end_time) return { c, idx: i };
  }
  return { c: BGM_SCORE.cues[0], idx: 0 };
}

function updateUI(t){
  currentT = DK.clamp(t, 0, DURATION);
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  const active = findCueAt(currentT);
  document.getElementById('readout').textContent =
    currentT.toFixed(2) + 's / ' + DURATION.toFixed(2) + 's · ' + (active.c ? active.c.cue_id : '');
  BGM_SCORE.cues.forEach((_, idx) => {
    const el = document.getElementById('cue-card-' + idx);
    if (el) el.classList.toggle('active', idx === active.idx);
  });
}

function startAudio(){
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('bgmMixSelect').value;
  stopSound = SOUND.live(scoreBGM, currentT, { mixMode });
  if (voAudio) {
    voAudio.currentTime = currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio(){
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play(){
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (nextT >= DURATION) { nextT = 0; currentT = 0; startAudio(); }
    updateUI(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause(){
  playing = false;
  document.getElementById('playBtn').textContent = 'Play Situational BGM';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  updateUI(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('bgmMixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});

  try {
    const mixMode = document.getElementById('bgmMixSelect').value;
    const res = await SOUND.renderOffline(scoreBGM, DURATION, 48000, { mixMode });
    const blob = SOUND.encodeWAV(res.inter, res.sr);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bgm_master.wav';
    a.click();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Export bgm_master.wav';
  }
});

window.addEventListener('DOMContentLoaded', () => {
  updateUI(0);
});
</script>
</body>
