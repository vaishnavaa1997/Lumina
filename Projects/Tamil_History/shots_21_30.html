// 1. Isometric Keeladi Baked-Brick House & Glowing Drainage Node (Shot 21)
function drawIsometricBrickHouse(g, x, y, s, litProg, gt) {
  g.save();
  g.translate(x, y);
  g.scale(s, s);

  // Soft blueprint shadow
  DK.contactShadow(g, 0, 42, 115, 28, 0.35);

  // Isometric Left Wall (Baked Red Brick)
  DK.poly(g, [[-95, -10], [0, 38], [0, -52], [-95, -100]], '#A84832', '#E27A58', 2);
  // Isometric Right Wall
  DK.poly(g, [[0, 38], [95, -10], [95, -100], [0, -52]], '#7E3220', '#E27A58', 2);

  // Sloped Terracotta Roof
  DK.poly(g, [[-105, -96], [0, -46], [48, -120], [-48, -162]], '#C95A38', '#FFB074', 2);
  DK.poly(g, [[0, -46], [105, -96], [48, -120]], '#963E24', '#FFB074', 2);

  // Courtyards & Doorway
  DK.poly(g, [[-55, 10], [-25, 25], [-25, -25], [-55, -40]], '#1E1412');

  // Glowing Cyan Drainage Outlet Node
  if (litProg > 0) {
    const pulse = 0.75 + 0.25 * Math.sin(gt * 6);
    DK.glow(g, 0, 42, 38 * litProg * pulse, '#5CE1FF', 0.85);
    DK.circle(g, 0, 42, 9 * litProg, '#FFFFFF');
    DK.ring(g, 0, 42, 16 * litProg, 2.5, '#5CE1FF');
  }

  g.restore();
}

// 2. Exploded Terracotta Ring Well (உறைகிணறு) & Barrel Pipe Cutaway (Shot 22)
function drawTerracottaRingWellCutaway(g, lt, gt) {
  const spread = DK.key(lt, [[0.0, 1.38], [2.5, 1.0]], DK.ease.inOutCubic);
  const cx = 960;
  const baseY = 760;

  // Subterranean Soil Strata Backdrop Panel (Left & Right of Well Shaft)
  g.save();
  DK.rr(g, 640, 260, 640, 560, 22);
  g.fillStyle = 'rgba(16, 32, 68, 0.72)';
  g.fill();
  g.strokeStyle = 'rgba(92, 225, 255, 0.35)';
  g.lineWidth = 2.5;
  g.stroke();

  // Horizontal Stratigraphy Lines
  for (let i = 1; i <= 4; i++) {
    const sy = 260 + i * 110;
    DK.seg(g, [[660, sy], [1260, sy]], 1.5, 'rgba(130, 185, 255, 0.18)');
  }

  // Fitted Barrel-Shaped Terracotta Conduits (சுடுமண் குழாய்) Entering from Right
  const pipeJoinX = DK.lerp(1360, 1135, DK.ease.outCubic(DK.clamp(lt / 2.4, 0, 1)));
  for (let p = 0; p < 3; p++) {
    const px = pipeJoinX + p * 125;
    const py = 420;
    DK.rr(g, px, py - 26, 132, 52, 14);
    g.fillStyle = DK.cylinderGrad(g, px, py - 26, px, py + 26, '#D96B27', -1);
    g.fill();
    g.strokeStyle = '#FFB074';
    g.lineWidth = 2;
    g.stroke();
    // Interlocking rim collar
    DK.rr(g, px - 6, py - 32, 16, 64, 6);
    g.fillStyle = '#B85218';
    g.fill();
  }

  // Flowing Cyan Water Stream Inside Terracotta Pipeline
  for (let w = 0; w < 6; w++) {
    const u = ((gt * 0.85 + w * 0.16) % 1);
    const wx = DK.lerp(1480, 1020, u);
    const wy = 420 + Math.sin(gt * 8 + w) * 4;
    DK.glow(g, wx, wy, 18, '#5CE1FF', 0.8);
    DK.circle(g, wx, wy, 5.5, '#FFFFFF');
  }

  // 6 Interlocking Terracotta Rings (உறைகிணறு)
  const ringCount = 6;
  const ringH = 62;
  const ringW = 240;
  for (let i = 0; i < ringCount; i++) {
    // Draw from bottom (0) to top (5)
    const targetY = baseY - i * (ringH * 0.88);
    const curY = baseY - i * (ringH * 0.88 * spread);

    g.save();
    g.translate(cx, curY);

    // Back inner shadow of terracotta ring
    DK.ellipse(g, 0, -ringH * 0.45, ringW * 0.5, 18, '#4A1E0C');

    // Cylindrical 3D-Shaded Terracotta Body
    DK.rr(g, -ringW * 0.5, -ringH * 0.45, ringW, ringH, 16);
    g.fillStyle = DK.cylinderGrad(g, -ringW * 0.5, 0, ringW * 0.5, 0, i % 2 === 0 ? '#D96B27' : '#C85E1E', -1);
    g.fill();
    g.strokeStyle = 'rgba(255, 190, 130, 0.55)';
    g.lineWidth = 2;
    g.stroke();

    // Interlocking Molded Rim Lip
    DK.ellipse(g, 0, -ringH * 0.45, ringW * 0.52, 14, 'rgba(255, 180, 110, 0.35)');
    DK.ring(g, 0, -ringH * 0.45, ringW * 0.48, 2, '#FFB870');

    g.restore();
  }

  // Compression Lock Flash at lt = 2.50s
  if (lt >= 2.45 && lt <= 3.2) {
    const fAlpha = 1 - (lt - 2.45) / 0.75;
    DK.glow(g, cx, 540, 260, '#5CE1FF', fAlpha * 0.65);
    DK.ring(g, cx, 540, 190 + (lt - 2.45) * 90, 4, DK.alpha('#5CE1FF', fAlpha));
  }

  // Callout Labels
  UI.pillBadge(g, lt, {
    t0: 0.5,
    x: 1480,
    y: 310,
    target: [1220, 420],
    text: 'BAKED CLAY PIPES (சுடுமண் குழாய்)',
    border: '#5CE1FF',
  });
  UI.pillBadge(g, lt, {
    t0: 1.1,
    x: 1480,
    y: 650,
    target: [1080, 620],
    text: 'INTERLOCKING RING WELL (உறைகிணறு)',
    border: '#FFB84D',
  });

  g.restore();
}

// 3. Roman Merchant Ship & Ancient Tamil Harbor Wharf (Shots 24 & 25)
function drawAncientHarborWharfAndShip(g, shipX, shipY, s, gt, showShip = true) {
  // Shimmering Bay of Bengal / Poompuhar Sea
  g.fillStyle = DK.linGrad(g, 0, 680, 0, 1080, ['#1B5E9E', '#124072', '#0A2446']);
  g.fillRect(-400, 680, 2720, 400);
  FX.pool(g, 460, 820, 520, 65, '#FFF9EB', 0.32);

  // Animated Sea Waves
  g.strokeStyle = 'rgba(220, 242, 255, 0.35)';
  g.lineWidth = 2.5;
  for (let wy = 710; wy < 960; wy += 36) {
    const wOff = Math.sin(gt * 2.2 + wy * 0.1) * 28;
    DK.seg(g, [[-100 + wOff, wy], [780 + wOff, wy]], 2.5, 'rgba(220, 242, 255, 0.32)');
  }

  // Roman Merchant Vessel (Corbita) with Striped Square Sail & Amphorae
  if (showShip) {
    const bob = Math.sin(gt * 2.6) * 5;
    const pitch = Math.cos(gt * 2.1) * 0.025;
    g.save();
    g.translate(shipX, shipY + bob);
    g.rotate(pitch);
    g.scale(s, s);

    // Hull Water Reflection Shadow
    DK.contactShadow(g, 0, 45, 230, 22, 0.42);

    // Wooden Curved Hull with Swan/Medusa Sternpost & Prow
    DK.poly(
      g,
      [
        [-210, -25],
        [-245, -95],
        [-190, -55],
        [185, -55],
        [240, -110],
        [215, -20],
        [165, 38],
        [-165, 38],
      ],
      DK.cylinderGrad(g, -220, -60, -220, 40, '#6E4226', -1),
      '#4A2A16',
      3
    );

    // Decorative Gold Trim & Oar Ports
    DK.seg(g, [[-185, -18], [185, -18]], 6, '#F5B942');

    // Roman Terracotta Amphorae Stacked on Deck

// 6. Strategic Map of Tamilakam Under Kalabhra Occupation (Shot 30)
function drawKalabhraOccupationMap(g, lt, gt) {
  const mapPts = [
    [780, 210], // Venkatam / Tirupati North Frontier
    [980, 235], // Kanchipuram / Tondaimandalam Coast

  const frontY = DK.lerp(205, 845, sweepProg);

  // Glowing Crimson Invasion Front Line
  DK.glow(g, 810, frontY, 180, '#FF4D6A', 0.75);

  // Downward Invasion Arrows
  [730, 820, 910].forEach((ax, idx) => {
    const ay = Math.min(frontY - 25, 280 + idx * 95 + ((gt * 60) % 90));
    if (ay > 230 && ay < frontY - 15) {
      DK.seg(g, [[ax, ay - 35], [ax, ay]], 4, '#FFB84D');
      DK.poly(g, [[ax, ay + 10], [ax - 9, ay - 6], [ax + 9, ay - 6]], '#FFB84D');
    }

  g.restore();

  // Major City Pins on Map
  const cities = [
    { x: 910, y: 285, name: 'KANCHI', tHit: 0.5 },
    { x: 860, y: 485, name: 'URAIYUR', tHit: 1.6 },

    { x: 675, y: 555, name: 'VANJI', tHit: 2.1 },

  cities.forEach((c) => {
    const occupied = lt >= c.tHit;
    const pinCol = occupied ? '#FF4D6A' : '#FFD54F';
    DK.glow(g, c.x, c.y, 24, pinCol, 0.8);
    DK.circle(g, c.x, c.y, 7, '#FFFFFF');

      size: 18,
      font: DK.FONTS.mono,
      weight: 700,
      color: occupied ? '#FFB0B8' : '#FFF3D6',
      align: 'left',
    });

  g.restore();
}

// ============================================================================
// STUDIO PLAYER & HEADLESS PUPPETEER RENDER HARNESS (SFX + AMBIENT ONLY)
// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;
window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();

  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});
shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});

window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
