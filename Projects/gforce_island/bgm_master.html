<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lumina Studio — Generative Situational Master BGM (bgm_master.html)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #080b14; color: #e2e8f0; font-family: 'Nunito', sans-serif; padding: 32px; max-width: 1360px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 16px; margin-bottom: 24px; }
h1 { font-family: 'Fredoka', sans-serif; font-size: 26px; color: #ff8a3d; }
.controls { background: #121829; border: 1px solid #26324d; border-radius: 12px; padding: 18px 22px; display: flex; align-items: center; gap: 14px; margin-bottom: 24px; box-shadow: 0 12px 32px rgba(0,0,0,0.45); }
button, select, label.btn { background: #1e293b; color: #f8fafc; border: 1px solid #3b4c6b; border-radius: 8px; padding: 9px 16px; font-family: inherit; font-weight: 800; font-size: 13.5px; cursor: pointer; }
button.primary { background: #ff8a3d; color: #0b0e17; border-color: #ff8a3d; }
button:hover, select:hover, label.btn:hover { border-color: #ff8a3d; }
#scrub { flex: 1; accent-color: #ff8a3d; cursor: pointer; }
#readout { font-family: 'Space Mono', monospace; font-size: 13px; color: #ffb074; min-width: 250px; }
.cue-list { display: grid; gap: 12px; }
.cue-card { background: #13192b; border: 1px solid #24304c; border-left: 5px solid #ff8a3d; border-radius: 8px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
.cue-card.active { border-color: #38c878; background: #1a233d; }
.cue-title { font-weight: 900; color: #ffb074; font-size: 15.5px; }
.cue-sub { color: #94a3b8; font-size: 13px; margin-top: 4px; }
.badge { font-family: 'Space Mono', monospace; font-size: 12px; background: #0d1220; color: #ff8a3d; padding: 5px 10px; border-radius: 6px; border: 1px solid #2e3c5e; }
</style>
</head>
<body>
<header>
<h1>LUMINA STUDIO — GENERATIVE SITUATIONAL MASTER BGM (STEP 12.1)</h1>
<div id="summary" class="badge"></div>
</header>

<div class="controls">
<button id="playBtn">Play Situational BGM</button>
<input id="scrub" type="range" min="0" max="1" step="0.001" value="0" />
<div id="readout">00.00s / 20.00s · CUE_01</div>
<select id="bgmMixSelect">
<option value="bgmOnly" selected>VO-Ducked BGM (0.18 Bed / 0.55 Swell)</option>
<option value="bgmFull">Unducked Full BGM (0.42 Bed / 0.55 Swell)</option>
</select>
<label class="btn">Load vo.wav (Preview Sync) <input id="voInput" type="file" accept="audio/*" style="display:none" /></label>
<button id="exportBtn" class="primary">Export bgm_master.wav</button>
</div>

<div class="cue-list" id="cueList"></div>

<script src="../../engine.js"></script>
<script>
// ============================================================================
// LOCKED SITUATIONAL MASTER BGM_SCORE OBJECT (G-FORCE ISLAND · 20.0s)
// ============================================================================
const BGM_SCORE = {
  total_duration: 20.0,
  cues: [
    {
      cue_id: 'CUE_01',
      shots: 'Shot 1',
      start_time: 0.0,
      end_time: 3.0,
      situation: 'PLAYFUL_FREEDOM',
      tension: 0.35,
      valence: 0.75,
      key: 'F Lydian',
      bpm: 112,
      timerChime: true,
      layerStems: { sub: true, pulse: true, pad: true, melody: true, perc: true, clock: false },
      desc: 'Sunny Theme Park Midway Opening with Bright Kalimba/Marimba & Brush Shaker'
    },
    {
      cue_id: 'CUE_02',
      shots: 'Shots 2–3',
      start_time: 3.0,
      end_time: 9.5,
      situation: 'TICKING_SURVIVAL',
      tension: 0.88,
      valence: -0.55,
      key: 'D Minor',
      bpm: 128,
      tempoCurve: [[3.0, 116], [9.5, 136]],
      timerChime: true,
      layerStems: { sub: true, pulse: true, pad: true, melody: true, perc: true, clock: true },
      desc: '420-Ft Vertical Coaster Drop & +5.0G Centrifugal Crush Countdown'
    },
    {
      cue_id: 'CUE_03',
      shots: 'Shot 4 (Part A)',
      start_time: 9.5,
      end_time: 12.0,
      situation: 'SCIENTIFIC_INQUIRY',
      tension: 0.50,
      valence: 0.10,
      key: 'G Dorian',
      bpm: 104,
      timerChime: true,
      layerStems: { sub: true, pulse: false, pad: true, melody: true, perc: false, clock: true },
      desc: 'Diagnostic X-Ray Cutaway into Brain Blood-Drain & Capillary Physics'
    },
    {
      cue_id: 'CUE_04',
      shots: 'Shot 4 (Part B) – Shot 5',
      start_time: 12.0,
      end_time: 16.8,
      situation: 'DIEGETIC_SILENCE',
      tension: 0.0,
      valence: 0.0,
      key: 'C Major',
      bpm: 100,
      timerChime: false,
      layerStems: { sub: false, pulse: false, pad: false, melody: false, perc: false, clock: false },
      desc: 'Deadpan Comedic BGM Cutout for the 5-Second Nap & $20 Souvenir Photo Punchline'
    },
    {
      cue_id: 'CUE_05',
      shots: 'Shot 6',
      start_time: 16.8,
      end_time: 20.0,
      situation: 'COSMIC_AWE',
      tension: 0.45,
      valence: 0.90,
      key: 'Bb Major',
      bpm: 110,
      timerChime: true,
      layerStems: { sub: true, pulse: true, pad: true, melody: true, perc: false, clock: false },
      desc: '0.55 Grand Theme Park Title Card Swell with Celesta/Harp Shimmer'
    }
  ],
  volume_automation: [
    { time: 0.0, volume: 0.35 },
    { time: 0.4, volume: 0.18 },  // Duck under Shot 1 VO
    { time: 2.8, volume: 0.45 },  // Mini swell on dolly-in to coaster apex
    { time: 3.3, volume: 0.18 },  // Duck under Shot 2–3 VO
    { time: 6.0, volume: 0.42 },  // Hit on +5.0G Radial Timer
    { time: 6.4, volume: 0.18 },  // Duck under Shot 3–4 VO
    { time: 11.9, volume: 0.18 },
    { time: 12.0, volume: 0.00 }, // HARD_STOP for deadpan nap & photo booth punchline
    { time: 16.7, volume: 0.00 },
    { time: 16.9, volume: 0.55 }, // 0.55 Grand Finale Swell on Title Card
    { time: 17.6, volume: 0.22 }, // Slight duck for final CTA line
    { time: 19.2, volume: 0.55 }, // Final button swell
    { time: 20.0, volume: 0.00 }
  ]
};

const DURATION = BGM_SCORE.total_duration;
function scoreBGM(k) {
  k.bgmScore(BGM_SCORE);
}

window.BGM_SCORE = BGM_SCORE;
window.DURATION = DURATION;
window.scoreBGM = scoreBGM;
window.scoreSound = scoreBGM;

let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let voAudio = null;

document.getElementById('summary').textContent =
  BGM_SCORE.cues.length + ' Situational Cues · Total ' + DURATION.toFixed(1) + 's';

const cueListEl = document.getElementById('cueList');
BGM_SCORE.cues.forEach((c, idx) => {
  const div = document.createElement('div');
  div.className = 'cue-card';
  div.id = 'cue-card-' + idx;
  const sit = c.situation || c.archetype || 'SCIENTIFIC_INQUIRY';
  const tens = c.tension !== undefined ? Math.round(c.tension * 100) + '%' : '50%';
  const val = c.valence !== undefined ? (c.valence >= 0 ? '+' + c.valence : c.valence) : '0.0';
  div.innerHTML =
    '<div>' +
      '<div class="cue-title">' + c.cue_id + ' (' + (c.shots || '') + ') · ' + sit + ' — ' + (c.desc || '') + '</div>' +
      '<div class="cue-sub">Tension: ' + tens + ' · Valence: ' + val + ' · Key: ' + (c.key || 'D Minor') + ' · BPM: ' + (c.bpm || 108) + ' · Timer Chime: ' + (c.timerChime ? 'Yes' : 'No') + '</div>' +
    '</div>' +
    '<div class="badge">' + c.start_time.toFixed(1) + 's – ' + c.end_time.toFixed(1) + 's</div>';
  cueListEl.appendChild(div);
});

function findCueAt(t) {
  for (let i = 0; i < BGM_SCORE.cues.length; i++) {
    const c = BGM_SCORE.cues[i];
    if (t >= c.start_time && t <= c.end_time) return { c, idx: i };
  }
  return { c: BGM_SCORE.cues[0], idx: 0 };
}

function updateUI(t) {
  currentT = DK.clamp(t, 0, DURATION);
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  const active = findCueAt(currentT);
  document.getElementById('readout').textContent =
    currentT.toFixed(2) + 's / ' + DURATION.toFixed(2) + 's · ' + (active.c ? active.c.cue_id : '');
  BGM_SCORE.cues.forEach((_, idx) => {
    const el = document.getElementById('cue-card-' + idx);
    if (el) el.classList.toggle('active', idx === active.idx);
  });
}

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('bgmMixSelect').value;
  stopSound = SOUND.live(scoreBGM, currentT, { mixMode });
  if (voAudio) {
    voAudio.currentTime = currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (nextT >= DURATION) { nextT = 0; currentT = 0; startAudio(); }
    updateUI(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play Situational BGM';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  updateUI(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('bgmMixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('exportBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportBtn');
  btn.textContent = 'Rendering bgm_master.wav...';
  const mixMode = document.getElementById('bgmMixSelect').value;
  const res = await SOUND.renderOffline(scoreBGM, DURATION, 48000, { mixMode });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bgm_master.wav';
  a.click();
  btn.textContent = 'Export bgm_master.wav';
});

window.addEventListener('DOMContentLoaded', () => {
  updateUI(0);
});
</script>
</body>
</html>
