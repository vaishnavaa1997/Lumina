<script>

// ============================================================================
// 2. REUSABLE BESPOKE SET-PIECE HELPERS (COASTER TRACKS, CHASSIS & ARCHWAY)
// ============================================================================
function drawCoasterSilhouetteBG(g, gt, o = {}) {
  const { col = '#381B3D', railCol = '#FF5268', lit = true } = o;
  g.save();
  // Massive vertical tower & parabolic loop on horizon
  g.strokeStyle = col;
  g.lineWidth = 6;
  for (let x = 280; x <= 1640; x += 68) {
    let topY = 780;
    if (x < 780) {
      const u = (x - 280) / 500;
      topY = 760 - Math.sin(u * Math.PI) * 520;
    } else if (x < 1260) {
      const u = (x - 780) / 480;
      topY = 760 - Math.sin(u * Math.PI) * 380;
    } else {
      const u = (x - 1260) / 380;
      topY = 760 - Math.sin(u * Math.PI) * 240;
    }
    DK.seg(g, [[x, 820], [x, topY]], 4, col);
    // Cross-bracing lattice
    for (let y = topY + 45; y < 800; y += 55) {
      DK.seg(g, [[x, y], [x + 68, y + 35]], 2, DK.alpha(col, 0.55));
    }
  }

  // Sweeping tubular rails
  g.strokeStyle = railCol;
  g.lineWidth = 10;
  g.beginPath();
  g.moveTo(160, 780);
  g.bezierCurveTo(380, 780, 440, 180, 560, 180);
  g.bezierCurveTo(680, 180, 710, 760, 820, 760);
  g.bezierCurveTo(920, 760, 960, 340, 1060, 340);
  g.bezierCurveTo(1160, 340, 1220, 760, 1680, 760);
  g.stroke();

  // Giant vertical loop ring
  DK.ring(g, 1020, 530, 195, 11, railCol);
  DK.ring(g, 1020, 530, 181, 4, col);

  // Chasing chaser lights along the apex
  if (lit) {
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2 + gt * 1.4;
      const lx = 1020 + Math.cos(ang) * 195;
      const ly = 530 + Math.sin(ang) * 195;
      DK.glow(g, lx, ly, 24, '#FFD578', 0.65);
      DK.circle(g, lx, ly, 4, '#FFFFFF');
    }
  }
  g.restore();
}

function drawParkGateArch(g, gt) {
  g.save();
  // Left & Right 3D Shaded Entrance Pillars
  [-560, 560].forEach((dx) => {
    const px = 960 + dx;
    DK.contactShadow(g, px, 845, 75, 14, 0.4);
    DK.rr(g, px - 42, 250, 84, 595, 16);
    g.fillStyle = DK.cylinderGrad(g, px - 42, 250, px + 42, 250, '#3B234A', -1);
    g.fill();
    // Gold trim bands
    g.fillStyle = '#FFB84D';
    g.fillRect(px - 46, 310, 92, 14);
    g.fillRect(px - 46, 780, 92, 16);
  });

  // Overhead Curved Midway Archway Banner
  g.save();
  g.beginPath();
  g.moveTo(360, 290);
  g.quadraticCurveTo(960, 145, 1560, 290);
  g.lineTo(1560, 355);
  g.quadraticCurveTo(960, 215, 360, 355);
  g.closePath();
  g.fillStyle = DK.linGrad(g, 360, 200, 1560, 340, ['#E53935', '#FF6B2B', '#E53935']);
  g.fill();
  g.lineWidth = 5;
  g.strokeStyle = '#FFD54F';
  g.stroke();
  g.restore();

  // Marquee bulbs along archway
  for (let i = 0; i <= 22; i++) {
    const u = i / 22;
    const bx = DK.lerp(385, 1535, u);
    const by = DK.lerp(290, 290, u) - Math.sin(u * Math.PI) * 72 + 28;
    const pulse = 0.5 + 0.5 * Math.sin(gt * 8 + i);
    DK.glow(g, bx, by, 18, '#FFE082', pulse * 0.8);
    DK.circle(g, bx, by, 5, '#FFF9E6');
  }

  // Operator Control Booth Podium on Left
  DK.rr(g, 460, 690, 210, 155, 18);
  g.fillStyle = DK.cylinderGrad(g, 460, 690, 670, 690, '#243052', -1);
  g.fill();
  g.strokeStyle = '#FFB84D';
  g.lineWidth = 3;
  g.stroke();
  // Flashing BIG RED "LAUNCH" Button on podium
  DK.rr(g, 535, 668, 60, 24, 10);
  g.fillStyle = '#FF2A55';
  g.fill();
  DK.glow(g, 565, 675, 38, '#FF2A55', 0.6 + 0.4 * Math.sin(gt * 10));
  DK.text(g, 'LAUNCH', 565, 755, { size: 24, font: DK.FONTS.mono, color: '#FFD578', weight: 700 });
  g.restore();
}

function drawCoasterCar(g, x, y, s, drawPassengersFn, o = {}) {
  const { nosePigeon = false, gt = 0, speedTilt = 0 } = o;
  g.save();
  g.translate(x, y);
  g.rotate(speedTilt);
  g.scale(s, s);

  // Back Seat Rests (3D Shaded Dark Charcoal)
  [-180, 140].forEach((sx) => {
    DK.rr(g, sx - 95, -245, 190, 210, 28);
    g.fillStyle = DK.cylinderGrad(g, sx - 95, -245, sx + 95, -245, '#1E243B', -1);
    g.fill();
    DK.rr(g, sx - 72, -265, 144, 58, 18);
    g.fillStyle = '#FFB84D';
    g.fill();
  });

  // Draw Passengers Inside Car
  if (typeof drawPassengersFn === 'function') {
    drawPassengersFn(g);
  }

  // Front Aerodynamic Fiberglass Coaster Shell (3D Cylindrical Shaded Red & Gold)
  DK.rr(g, -380, -95, 780, 165, 58);
  g.fillStyle = DK.cylinderGrad(g, -380, -95, -380, 70, '#E53935', -1);
  g.fill();
  g.strokeStyle = '#FF8A65';
  g.lineWidth = 4;
  g.stroke();

  // Racing Lightning Stripe across Chassis
  DK.poly(
    g,
    [
      [-340, -18],
      [280, -32],
      [240, 12],
      [-320, 24]
    ],
    '#FFB84D'
  );
  DK.text(g, 'WIDOWMAKER · CAR 01', -40, -4, {
    size: 24,
    font: DK.FONTS.mono,
    weight: 700,
    color: '#181C2E'
  });

  // Heavy-Duty Padded Over-The-Shoulder / Lap Harness Bar
  DK.rr(g, -310, -118, 620, 28, 14);
  g.fillStyle = DK.cylinderGrad(g, -310, -118, -310, -90, '#2B324A', -1);
  g.fill();
  DK.seg(g, [[-180, -95], [-180, -135]], 14, '#F5B942');
  DK.seg(g, [[140, -95], [140, -135]], 14, '#F5B942');

  // Bogie Wheels & Steel Track Rollers Underneath
  [-260, 0, 260].forEach((wx) => {
    DK.rr(g, wx - 42, 55, 84, 36, 10);
    g.fillStyle = '#262F47';
    g.fill();
    DK.circle(g, wx - 22, 82, 22, DK.sphereGrad(g, wx - 22, 82, 22, '#687898'));
    DK.circle(g, wx + 22, 82, 22, DK.sphereGrad(g, wx + 22, 82, 22, '#687898'));
  });

  // Optional Calm Pigeon Riding the Nose Cone
  if (nosePigeon) {
    DK.animal(g, {
      kind: 'pigeon',
      x: 345,
      y: -92,
      s: 0.92,
      flipX: true,
      expr: 'neutral',
      t: gt
    });
  }

  g.restore();
}

// ============================================================================
// 3. SHOT REGISTRY (SHOTS 1 TO 6 · 00.0s – 20.0s)
// ============================================================================
const SHOTS = [
  // --------------------------------------------------------------------------
  // SHOT 1: Welcome to G-Force Island (00.0s – 03.0s)
  // --------------------------------------------------------------------------
  {
    shot_number: 1,
    id: 'shot_01',
    title: 'Welcome to G-Force Island',
    start: 0.0,
    end: 3.0,
    duration: 3.0,
    vo_line: 'Tired of theme parks that respect the laws of human biology? Welcome to G-Force Island.',
    env_id: 'ENV_PARK_GATE',
    chars: 'CHAR_OPERATOR, CHAR_MAYA, CHAR_LEO',
    on_screen_text: 'G-FORCE ISLAND · ZERO REFUNDS · 100% GRAVITY',
    camera_sfx: 'Dolly In (z: 0.94 -> 1.12) · citySilence bed + pillBadge + ding',
    transOut: THEME.SHOTS[1].transOut,
    draw(g, lt, gt, u) {
      const m = DK.mood('sunriseFlight');
      const cam = DK.key(
        lt,
        [
          [0.0, { x: 0, y: 0, z: 0.94, r: 0 }],
          [3.0, { x: 0, y: -38, z: 1.12, r: 0 }]
        ],
        DK.ease.inOutCubic
      );

      DK.fivePlane(g, cam, {
        bgSkyDepth: 0.15,
        bgSky: (g) => {
          DK.backdrop(g, m.sky);
          FX.sun(g, 1480, 250, 74, '#FFF6E0', '#FFD59A', 4.5);
          FX.godRays(g, 1480, 250, { count: 7, angle: Math.PI * 0.68, spread: 0.7, len: 1800, a: 0.14, t: gt });
          FX.clouds(g, { seed: 14, count: 6, y: 150, h: 130, color: '#FFE6C2', a: 0.25, t: gt, speed: 12 });
        },
        bgFarDepth: 0.40,
        bgFarBlur: 3,
        bgFar: (g) => {
          FX.hills(g, { seed: 8, y: 770, amp: 95, color: '#4A2545' });
          drawCoasterSilhouetteBG(g, gt, { col: '#381B3D', railCol: '#FF5268', lit: true });
        },
        mgBackDepth: 0.75,
        mgBack: (g) => {

          FX.lampPost(g, 260, 840, 350, { light: '#FFD59A', on: true, a: 0.25 });
          FX.lampPost(g, 1660, 840, 350, { light: '#FFD59A', on: true, a: 0.25 });
          drawParkGateArch(g, gt);
        },
        mgHero: (g) => {
          // Bored Ride Operator Stan at Podium
          DK.char(g, {
            ...THEME.CHARS.CHAR_OPERATOR,
            x: 565,
            y: 840,
            s: 1.04,
            eyeMode: 'halfLidded',
            brows: 'neutral',
            mouth: lt > 1.6 ? 'yawn' : 'neutral',
            look: [0.3, 0.1],
            pose: { rightHand: [36, -155] },
            t: gt,
            seed: 10
          });

          // Maya (Thrill-Seeker) celebrating in center
          DK.char(g, {
            ...THEME.CHARS.CHAR_MAYA,
            x: 940,
            y: 845,
            s: 1.08,
            eyeMode: 'happyArch',
            brows: 'raised',
            mouth: 'laugh',
            pose: { preset: 'celebrate' },
            t: gt,
            seed: 20
          });

          // Leo staring nervously up at the 420-ft vertical loop
          const nervousProgress = DK.prog(lt, 1.1, 2.5);
          DK.char(g, {
            ...THEME.CHARS.CHAR_LEO,
            x: 1210,
            y: 845,
            s: 1.08,
            eyeMode: nervousProgress > 0.5 ? 'panic' : 'warm',
            pupilSize: DK.lerp(0.75, 0.35, nervousProgress),
            look: [-0.35, -0.65],
            brows: 'sad',
            mouth: nervousProgress > 0.5 ? 'gasp' : 'frown',
            t: gt,
            seed: 30
          });

          // Diegetic Park Welcome Badge
          UI.pillBadge(g, lt, {
            t0: 0.35,
            x: 960,
            y: 175,
            text: 'G-FORCE ISLAND',
            subText: 'ZERO REFUNDS · 100% GRAVITY',
            border: '#FFB84D',
            size: 30
          });
        },
        fgBokehDepth: 1.45,
        fgBokehBlur: 12,
        fgBokeh: (g) => {
          FX.bokehOrbs(g, gt, { count: 14, color: '#FFD47E', a: 0.2 });
          FX.dust(g, gt, { count: 40, color: '#FFE9D2', a: 0.4 });
        }
      });

      DK.finishFrame(g, gt, { vignette: 0.36, grain: 0.03 });
    }
  },

  // --------------------------------------------------------------------------
  // SHOT 2: The 420-Foot Vertical Crest & Seatbelt Click (03.0s – 06.0s)
  // --------------------------------------------------------------------------
  {
    shot_number: 2,
    id: 'shot_02',
    title: 'The 420-Foot Vertical Crest',
    start: 3.0,
    end: 6.0,
    duration: 3.0,
    vo_line: 'Meet The Widowmaker. Four hundred feet straight up, followed by a ninety-degree drop!',
    env_id: 'ENV_COASTER_APEX',
    chars: 'CHAR_MAYA, CHAR_LEO, ANIMAL_PIGEON + DK.hand',
    on_screen_text: '420 FT APEX · 90° VERTICAL DROP',
    camera_sfx: 'Apex Tilt & Zoom · wind bed + counterTick + seatbeltClick + decompressionBang',
    transOut: THEME.SHOTS[2].transOut,
    draw(g, lt, gt, u) {
      const m = DK.mood('stratosphereDay');
      const teeter = lt > 1.2 ? Math.sin((lt - 1.2) * 14) * 0.015 : 0;
      const cam = DK.key(
        lt,
        [
          [0.0, { x: -45, y: 20, z: 0.98, r: -0.02 }],
          [1.2, { x: 40, y: -12, z: 1.14, r: 0.03 }],
          [3.0, { x: 75, y: -22, z: 1.22, r: 0.06 + teeter }]
        ],
        DK.ease.inOutCubic
      );

      DK.fivePlane(g, cam, {
        bgSkyDepth: 0.15,
        bgSky: (g) => {
          DK.backdrop(g, m.sky);
          FX.sun(g, 360, 210, 68, '#FFFDF5', '#FFE599', 3.8);
        },
        bgFarDepth: 0.40,
        bgFarBlur: 4,
        bgFar: (g) => {
          FX.cumulusDeck(g, gt, { y: 740, seed: 12, palette: 'day', speed: 24 });
        },
        mgBackDepth: 0.75,
        mgBack: (g) => {
          // Red tubular coaster crest track curving into a 90-degree cliff on the right
          g.save();
          g.strokeStyle = '#991B1B';
          g.lineWidth = 18;
          for (let tx = 260; tx <= 1360; tx += 110) {
            DK.seg(g, [[tx, 790], [tx - 30, 1080]], 12, '#7F1D1D');
          }
          g.strokeStyle = '#FF3B30';
          g.lineWidth = 24;
          g.beginPath();
          g.moveTo(-100, 860);
          g.quadraticCurveTo(860, 740, 1280, 790);
          g.quadraticCurveTo(1480, 815, 1540, 1180);
          g.stroke();
          g.restore();
        },
        mgHero: (g) => {
          const isPanic = lt >= 1.2;
          const carTilt = DK.key(lt, [[0.0, -0.04], [1.2, 0.04], [2.6, 0.14], [3.0, 0.28]]);

          drawCoasterCar(
            g,
            940,
            720,
            1.02,
            (g) => {
              // Maya (Left Seat) loving every second
              DK.char(g, {
                ...THEME.CHARS.CHAR_MAYA,
                x: -180,
                y: 25,
                s: 1.08,
                pose: { preset: 'celebrate', sit: true },
                eyeMode: 'happyArch',
                brows: 'raised',
                mouth: 'laugh',
                seatbelt: true,
                t: gt,
                seed: 21
              });

              // Leo (Right Seat) realizing it's a 90-degree vertical cliff
              DK.char(g, {
                ...THEME.CHARS.CHAR_LEO,
                x: 140,
                y: 25,
                s: 1.08,
                pose: { preset: 'seated', sit: true },
                eyeMode: isPanic ? 'panic' : 'warm',
                pupilSize: isPanic ? 0.26 : 0.75,
                look: isPanic ? [0.55, 0.65] : [0.25, 0.35],
                brows: 'raised',
                mouth: isPanic ? 'scream' : 'o',
                hairWind: isPanic ? 0.45 : 0.1,
                seatbelt: true,
                t: gt,
                seed: 31
              });
            },
            { nosePigeon: true, gt, speedTilt: carTilt }
          );

          // 5-Finger Articulated Hand double-checking the buckle (0.65s - 2.1s)
          const handAlpha = DK.clamp(DK.prog(lt, 0.55, 0.85) - DK.prog(lt, 2.0, 2.35), 0, 1);
          if (handAlpha > 0.01) {
            g.save();
            g.globalAlpha = handAlpha;
            DK.circle(g, 1110, 420, 115, '#12182D');
            DK.ring(g, 1110, 420, 115, 4, '#FFB84D');
            g.beginPath();
            g.arc(1110, 420, 112, 0, Math.PI * 2);
            g.clip();
            // Seatbelt strap inside magnifier
            g.fillStyle = '#2B324A';
            g.fillRect(990, 405, 240, 32);
            DK.rr(g, 1080, 396, 60, 50, 8);
            g.fillStyle = '#CBD5E8';
            g.fill();
            DK.hand(g, {
              x: 1115,
              y: 445 + Math.sin(lt * 16) * 4,
              s: 0.72,
              skin: '#E8A478',
              sleeveColor: '#FF851B',
              pose: 'buckle',
              rot: -0.25,
              t: gt
            });
            g.restore();
          }

          // Animated Altitude Counter Badge
          UI.pillBadge(g, lt, {
            t0: 0.35,
            x: 470,
            y: 250,
            target: [640, 620],
            countFrom: 0,
            countTo: 420,
            countStart: 0.35,
            countEnd: 1.55,

// ============================================================================
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;

window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0;
let playing = false;
let rafId = null;
let lastTs = 0;
let stopSound = null;
let activeShotFilter = 'all';
let voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) {
    DK.drawShot(ctx, s, lt, gt, u);
  } else {
    s.draw(ctx, lt, gt, u);
  }
  ctx.restore();

  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent =
    gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) {
    stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  }
  if (voAudio) {
    voAudio.currentTime = BATCH_START + currentT;
    voAudio.play().catch(() => {});
  }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START;
        const sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});
shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});
document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});
window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  renderAtLocal(0);
});
</script>
</body>
